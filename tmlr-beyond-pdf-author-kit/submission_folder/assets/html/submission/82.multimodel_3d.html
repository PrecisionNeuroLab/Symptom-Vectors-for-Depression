        <script charset="utf-8" src="https://cdn.plot.ly/plotly-3.3.1.min.js" integrity="sha256-4rD3fugVb/nVJYUv5Ky3v+fYXoouHaBSP20WIJuEiWg=" crossorigin="anonymous"></script>                <div id="figure" class="plotly-graph-div" style="height:500px; width:100%;"></div>            <script type="text/javascript">                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("figure")) {                    Plotly.newPlot(                        "figure",                        [{"customdata":[["dsm-5,mood","This person experiences a depressed mood, feeling sad, empty, or\u003cbr\u003ehopeless, and may appear tearful to others. They have lost interest or\u003cbr\u003epleasure in activities they used to enjoy. They struggle with feelings\u003cbr\u003eof worthlessness or carry excessive or inappropriate guilt that goes\u003cbr\u003ebeyond normal self-criticism. They also have difficulty thinking\u003cbr\u003eclearly, concentrating, or making decisions."],["ham-d-1,mood","Depressed Mood: They have a gloomy attitude and feel pessimistic about\u003cbr\u003ethe future. They experience persistent feelings of sadness and may\u003cbr\u003ehave a tendency to weep."],["ham-d-2,mood","Feelings of Guilt: They engage in self-reproach and feel they have let\u003cbr\u003epeople down. They experience ideas of guilt, and may believe their\u003cbr\u003epresent illness is a punishment. In some cases, they may have\u003cbr\u003edelusions or hallucinations related to guilt."],["ham-d-3,mood","Work and Interests: They experience feelings of incapacity,\u003cbr\u003elistlessness, indecision, and vacillation. They have lost interest in\u003cbr\u003ehobbies and show decreased social activities. Their productivity has\u003cbr\u003edecreased, and they may be unable to work due to their present\u003cbr\u003eillness."],["ham-d-4,mood","Anxiety (Psychic): They experience tension and irritability. They\u003cbr\u003eworry about minor matters and have an apprehensive attitude. They may\u003cbr\u003eexperience fears."],["icd-10,mood","They experience a persistently low mood throughout the day, which\u003cbr\u003eothers may also observe. They have lost interest or pleasure in\u003cbr\u003eactivities they would normally enjoy. They struggle with feelings of\u003cbr\u003eworthlessness and carry excessive or inappropriate guilt. Their\u003cbr\u003eability to think clearly or concentrate is diminished, and they often\u003cbr\u003efeel indecisive. Their self-confidence and self-esteem are reduced."],["madrs-1,mood","Apparent Sadness: They appear despondent, gloomy, or in despair\u2014beyond\u003cbr\u003eordinary low spirits. This is reflected in their speech, facial\u003cbr\u003eexpression, and posture. They may look dispirited or unhappy, and at\u003cbr\u003etimes struggle to brighten up even when circumstances might warrant\u003cbr\u003eit."],["madrs-2,mood","Reported Sadness: They describe feeling depressed, low in spirits, or\u003cbr\u003edespondent, regardless of whether this is visible in their appearance.\u003cbr\u003eThey may report feeling beyond help or without hope. Their mood may be\u003cbr\u003einfluenced by external circumstances to varying degrees, or it may\u003cbr\u003efeel continuous and unvarying."],["madrs-3,mood","Inner Tension: They experience feelings of ill-defined discomfort,\u003cbr\u003eedginess, or inner turmoil. This mental tension can escalate to\u003cbr\u003efeelings of panic, dread, or anguish. They may seek reassurance and\u003cbr\u003efind it difficult to master these feelings on their own."],["madrs-4,mood","Concentration Difficulties: They have difficulty collecting their\u003cbr\u003ethoughts or sustaining concentration. This may interfere with their\u003cbr\u003eability to read, hold a conversation, or complete tasks that require\u003cbr\u003efocused attention."],["madrs-5,mood","Inability to Feel: They experience reduced interest in their\u003cbr\u003esurroundings or in activities that would normally bring them pleasure.\u003cbr\u003eTheir ability to react with appropriate emotion to circumstances or\u003cbr\u003epeople feels diminished. They may feel emotionally numb or\u003cbr\u003edisconnected from friends and loved ones, struggling to feel anger,\u003cbr\u003egrief, or joy."],["madrs-6,mood","Pessimistic Thoughts: They experience thoughts of guilt, inferiority,\u003cbr\u003eself-reproach, or remorse. They may engage in self-accusations or feel\u003cbr\u003eincreasingly pessimistic about the future, dwelling on ideas of\u003cbr\u003efailure, sin, or ruin."],["phq-9-1,mood","They have little interest or pleasure in doing things."],["phq-9-2,mood","They feel down, depressed, or hopeless."],["phq-9-3,mood","They feel bad about themselves, or feel like a failure, or feel they\u003cbr\u003ehave let themselves or their family down."],["phq-9-4,mood","They have trouble concentrating on things, such as reading the\u003cbr\u003enewspaper or watching television."],["proceed-1,mood","Perception of Self: This person often feels that others are against\u003cbr\u003ethem or out to get them. They experience a profound sense of\u003cbr\u003eisolation, as though they are fundamentally alone in the world. They\u003cbr\u003ecarry a belief that they are a burden to those around them and feel\u003cbr\u003ethat others do not truly understand them. They struggle with\u003cbr\u003econfidence in their own abilities and hold a diminished view of their\u003cbr\u003eown worth. At times, they feel disconnected from themselves or their\u003cbr\u003esurroundings, and they may have difficulty recognizing\u003cbr\u003ethemselves\u2014whether in the mirror or in terms of who they feel they are\u003cbr\u003eas a person."],["proceed-2,mood","Cognitive Symptoms: This person finds it difficult to feel motivated\u003cbr\u003eor to maintain interest in activities. They believe their condition is\u003cbr\u003euntreatable and hold a generally pessimistic view of situations. Their\u003cbr\u003ethinking tends to be distorted, often interpreting events in\u003cbr\u003enegatively skewed ways. They struggle to make decisions and have\u003cbr\u003edifficulty with planning, organizing, and following through on tasks.\u003cbr\u003eAdapting to new information or shifting between tasks is challenging\u003cbr\u003efor them. They find it hard to solve problems effectively and\u003cbr\u003eexperience lapses in memory. Maintaining focus and concentration is\u003cbr\u003edifficult, as is managing their time. Their perception of time may\u003cbr\u003efeel altered\u2014either dragging or slipping away. They have trouble\u003cbr\u003eenvisioning a positive future and tend to dwell on negative thoughts\u003cbr\u003erepeatedly. Their thinking often feels foggy or unclear. They may have\u003cbr\u003ereduced capacity to understand or share in others' feelings and show\u003cbr\u003ediminished interest in social connection."],["proceed-3,mood","Mood and Emotional Symptoms: This person experiences significant\u003cbr\u003epsychological pain and a pervasive sense that things will not improve.\u003cbr\u003eThey feel powerless to change their circumstances and see themselves\u003cbr\u003eas having little value. A general sense of feeling bad pervades their\u003cbr\u003eexperience, often accompanied by guilt. Sadness is a frequent\u003cbr\u003ecompanion, along with feelings of anxiety and a fear of failing at\u003cbr\u003ethings they attempt. They often feel restless and on edge, becoming\u003cbr\u003eeasily irritated and frustrated. They have difficulty managing their\u003cbr\u003eemotions and controlling their impulses. Their mood may not shift\u003cbr\u003eappropriately in response to positive events. They have lost their\u003cbr\u003esense of humor and find little or no pleasure in activities they once\u003cbr\u003eenjoyed. They often feel empty inside, and their emotional responses\u003cbr\u003ein general feel muted or dulled."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#0072B2","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Mood, Core Clinical \u00b7 In-Sample","visible":"legendonly","x":{"dtype":"f8","bdata":"QM66EgYv9T8A7+9ZKJHsP4CjFI9L2uc\u002fAJW9YUNe5T+AtOD5upTgP8BZXO46VfM\u002fgB47gEPf5z+Ajb60foroP4C5t5kGfO8\u002fAFie2OdV3T+AR8Lb4aPpPwAY+YP1a\u002fE\u002fAA9iCaXW4b8ASKNFPBnbvwCUswIOp9o\u002fADGBZ+Ad5b8A4X4U2wjzP0DvYGB2f\u002fU\u002fwA\u002fBhZ+s9T8="},"y":{"dtype":"f8","bdata":"AIAU0C\u002f4iL8AQHzr04GtvwAQh3\u002fAhb6\u002fAKzQgFxS0T8AKIKR9nLOPwDAqR3ynL4\u002fAPiCXSH6xz8AUCm2Pb\u002fAPwAQFhbwUrA\u002fALY5vUIM4D8AAKDlaQyVPwDwgRyvOMu\u002fAGA7l9c0yj8AACDgpGugPwAAtfVVGq+\u002fAJrv7e8W4z8AiM0adGXUvwCAjatgI6W\u002fAGCu7kuEvb8="},"z":{"dtype":"f8","bdata":"ACSu+EDv1L8A4KnZO4TCPwAQmGoSrNc\u002fANDh7DqWtD8AqNqoCnTNPwC8Co++ctS\u002fAKCl3O8Sqj8AsKo5mV22PwCgIwLC4Ky\u002fAICR2xmqrD8AMJzPMArGPwCwqWPUfrk\u002fADoGbCcf9T8AwDlDUuP0PwAaVifGy+M\u002fAHP2BbUR8T8A0P\u002fHp7DAPwCQW6rCJNK\u002fABDqMMCxzL8="},"type":"scatter3d"},{"customdata":[["dsm-5,somatic","They experience noticeable changes in weight\u2014either losing or\u003cbr\u003egaining\u2014without intentionally trying to diet, along with shifts in\u003cbr\u003etheir appetite. Their sleep is disrupted, with difficulty falling or\u003cbr\u003estaying asleep, or alternatively, sleeping far more than usual. Others\u003cbr\u003ecan observe changes in their physical movements and behavior: they may\u003cbr\u003eappear restless and agitated, or conversely, slowed down in their\u003cbr\u003espeech and actions. They feel persistently tired and lack the energy\u003cbr\u003ethey once had."],["ham-d-1,somatic","Initial Insomnia: The person has difficulty falling asleep at the\u003cbr\u003ebeginning of the night."],["ham-d-10,somatic","Hypochondriasis: The person shows excessive focus on their body and\u003cbr\u003ehealth, ranging from bodily self-absorption to preoccupation with\u003cbr\u003ehealth concerns, a tendency to complain about physical ailments, or\u003cbr\u003efixed false beliefs about having a serious illness."],["ham-d-11,somatic","Weight Loss: The person has experienced a noticeable decrease in body\u003cbr\u003eweight."],["ham-d-2,somatic","Middle Insomnia: The person feels restless and disturbed during the\u003cbr\u003enight, often waking up during sleeping hours."],["ham-d-3,somatic","Delayed Insomnia: The person wakes up in the early hours of the\u003cbr\u003emorning and is unable to fall asleep again."],["ham-d-4,somatic","Retardation: The person experiences slowness in their thought\u003cbr\u003eprocesses, speech, and physical activity. They may appear apathetic\u003cbr\u003eor, in more pronounced cases, enter a state of stupor."],["ham-d-5,somatic","Agitation: The person displays restlessness that is associated with\u003cbr\u003efeelings of anxiety."],["ham-d-6,somatic","Somatic Anxiety: The person experiences physical symptoms related to\u003cbr\u003eanxiety, which may include gastrointestinal issues such as\u003cbr\u003eindigestion, cardiovascular symptoms like palpitations, headaches,\u003cbr\u003erespiratory difficulties, or genito-urinary complaints."],["ham-d-7,somatic","Gastrointestinal Somatic Symptoms: The person experiences a loss of\u003cbr\u003eappetite, a heavy feeling in the abdomen, or constipation."],["ham-d-8,somatic","General Somatic Symptoms: The person feels heaviness in their limbs,\u003cbr\u003eback, or head, and may experience diffuse backaches, a loss of energy,\u003cbr\u003eor easy fatiguability."],["ham-d-9,somatic","Genital Symptoms: The person experiences a loss of libido or, in the\u003cbr\u003ecase of women, menstrual disturbances."],["icd-10,somatic","They experience changes in their appetite\u2014either eating much less or\u003cbr\u003emuch more than usual\u2014which leads to noticeable weight loss or gain.\u003cbr\u003eTheir sleep is disrupted; they may struggle to fall or stay asleep, or\u003cbr\u003econversely find themselves sleeping far more than normal. Even minimal\u003cbr\u003eeffort leaves them feeling tired and drained, as though their energy\u003cbr\u003ehas been depleted. Their physical movements and behavior have also\u003cbr\u003echanged\u2014they may appear restless and agitated, or alternatively seem\u003cbr\u003eslowed down in their speech and actions."],["madrs-1,somatic","Reduced sleep: They experience a reduction in the duration or depth of\u003cbr\u003etheir sleep compared to their usual pattern when feeling well. This\u003cbr\u003emay manifest as difficulty falling asleep, lighter or more fitful\u003cbr\u003esleep, sleep that is broken or shortened by several hours, or sleeping\u003cbr\u003eonly a few hours per night."],["madrs-2,somatic","Reduced appetite: They experience a diminished appetite compared to\u003cbr\u003ewhen they are well. This presents as a decreased desire for food or a\u003cbr\u003eneed to force themselves to eat. Food may seem tasteless, and they may\u003cbr\u003erequire encouragement or persuasion from others to eat at all."],["madrs-3,somatic","Lassitude: They have difficulty getting started with activities and\u003cbr\u003eexperience slowness in initiating and performing everyday tasks.\u003cbr\u003eRoutine activities require considerable effort to begin and carry out,\u003cbr\u003eand in more pronounced cases, they may feel unable to do anything\u003cbr\u003ewithout assistance from others."],["phq-9-1,somatic","They have trouble falling asleep, staying asleep, or sleep too much."],["phq-9-2,somatic","They feel tired or have little energy."],["phq-9-3,somatic","They have a poor appetite or overeat."],["phq-9-4,somatic","They move or speak so slowly that other people could have noticed, or\u003cbr\u003ethe opposite\u2014they are so fidgety or restless that they have been\u003cbr\u003emoving around a lot more than usual."],["proceed-1,somatic","Physical symptoms: They experience pain or other physical symptoms.\u003cbr\u003eTheir appetite or weight has changed. They have difficulty with sexual\u003cbr\u003efunction."],["proceed-2,somatic","Sleep: They sleep excessively. Their sleep is disturbed or restless.\u003cbr\u003eThey have difficulty falling or staying asleep."],["proceed-3,somatic","Psychomotor and expression: They cry. They speak very little or not at\u003cbr\u003eall. Their facial expressions appear flat or diminished. Their\u003cbr\u003emovements and reactions are slowed."],["proceed-4,somatic","Energy: They feel that everything requires effort. They feel\u003cbr\u003ephysically weak. They have low energy. They feel fatigued or tired."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#009E73","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Somatic, Core Clinical \u00b7 In-Sample","visible":"legendonly","x":{"dtype":"f8","bdata":"ALziqnDduT+A61FkJt7ivwD6IsPVNM0\u002fABcZyldg478AaEk7Up\u002fgv4Ds9F8di+W\u002fAOsDkJCk3z8AcJxjiDS5v4AfdDY36eQ\u002fAKjuNf3ewb8AqHI2BlfgPwBDoQgzedK\u002fAOsWP7Rz1D8AyI0OiWK0vwAAnwKNIH+\u002fALCdOFlc3T8Af5V31RL2v8D0G4OCUPG\u002fALNZJplT\u002fb8ApBooBWTXvwCSQ71cus2\u002fABiWW9AL3r8AlB8dOcfQvwAKZsPwBck\u002f"},"y":{"dtype":"f8","bdata":"AMW5YnlW8D8AxzUGDYj3PwCMB73Qsdg\u002fAJiVJwg49T8AC6JIoyr0PwAvlTQmSPc\u002fAH7H8OKd6T8A3Po1rRzlPwAbB4o8JvA\u002fADxe6lWV8z8AFLRpc9XvPwCLSeXOG\u002fM\u002fAOuYjty68T8AcClBVnH0PwC6fvZwyes\u002fAKx86bh05T8A7x67mvr1PwCi1y9IjOw\u002fADZrVb4v8D8AxHCtaljtPwBRm+53PfA\u002fAD1IoVRp9j8A1hR\u002fEa3qPwDi+i5y7+Y\u002f"},"z":{"dtype":"f8","bdata":"ALDTY4qVwL8AgJmQo6vDPwDQOjBDyNc\u002fADTLDj1D0T8AeCUktc3RPwCo26yHjc8\u002fANQ5a4SB0r8AoF78iuLZPwDEwxvYkuS\u002fANDZYLiysr8A+M80AQjgvwCQbyrrCrg\u002fAOTJajgf278ASLwJITLJvwAwv u002fAA9sj02y9D8AxoQ5BMrrP4DccS7OnQJAAI5756cp6z8AYjbPzJDmP4BpzCT8xgBAAKR0OgYW1D8ApKvL8BnwP4AnAh7cegRAAOtBrDfd8T8ANtXlgPXlPwBiVRXtDfE\u002fANAz4jnf5z8AX7uiuzj+PwC7CEzoJPc\u002fgCLhCCYZAUAA3rU8yLb1PwBIqXL4TQFAAGIdgJ8S9j8Aqu\u002f48KrzPwC91BZlrgBAACq9NUcp9z8ARSe8MCkDQADD9brTlPY\u002fAIYwDK2X7T8AFlbqCjz\u002fPwBDsJIvuwlAAGstSNpG9T8Aw5YeOgQAQAAjbV7MEfM\u002fAOsdsuZn+T8A9KBgnDHnPwAsx9HQh\u002fY\u002fAIrVzqPk5z8AmfDHq572P4BqaLC21ABAAOwHkhly7j8Axt8ysmb9PwCgCUjlYv0\u002fAOWBjmPpA0AAU2XRzu33PwDRVL2ckQBA"},"type":"scatter3d"},{"customdata":[["dsm-5,mood","This person experiences a depressed mood, feeling sad, empty, or\u003cbr\u003ehopeless, and may appear tearful to others. They have lost interest or\u003cbr\u003epleasure in activities they used to enjoy. They struggle with feelings\u003cbr\u003eof worthlessness or carry excessive or inappropriate guilt that goes\u003cbr\u003ebeyond normal self-criticism. They also have difficulty thinking\u003cbr\u003eclearly, concentrating, or making decisions."],["ham-d-1,mood","Depressed Mood: They have a gloomy attitude and feel pessimistic about\u003cbr\u003ethe future. They experience persistent feelings of sadness and may\u003cbr\u003ehave a tendency to weep."],["ham-d-2,mood","Feelings of Guilt: They engage in self-reproach and feel they have let\u003cbr\u003epeople down. They experience ideas of guilt, and may believe their\u003cbr\u003epresent illness is a punishment. In some cases, they may have\u003cbr\u003edelusions or hallucinations related to guilt."],["ham-d-3,mood","Work and Interests: They experience feelings of incapacity,\u003cbr\u003elistlessness, indecision, and vacillation. They have lost interest in\u003cbr\u003ehobbies and show decreased social activities. Their productivity has\u003cbr\u003edecreased, and they may be unable to work due to their present\u003cbr\u003eillness."],["ham-d-4,mood","Anxiety (Psychic): They experience tension and irritability. They\u003cbr\u003eworry about minor matters and have an apprehensive attitude. They may\u003cbr\u003eexperience fears."],["icd-10,mood","They experience a persistently low mood throughout the day, which\u003cbr\u003eothers may also observe. They have lost interest or pleasure in\u003cbr\u003eactivities they would normally enjoy. They struggle with feelings of\u003cbr\u003eworthlessness and carry excessive or inappropriate guilt. Their\u003cbr\u003eability to think clearly or concentrate is diminished, and they often\u003cbr\u003efeel indecisive. Their self-confidence and self-esteem are reduced."],["madrs-1,mood","Apparent Sadness: They appear despondent, gloomy, or in despair\u2014beyond\u003cbr\u003eordinary low spirits. This is reflected in their speech, facial\u003cbr\u003eexpression, and posture. They may look dispirited or unhappy, and at\u003cbr\u003etimes struggle to brighten up even when circumstances might warrant\u003cbr\u003eit."],["madrs-2,mood","Reported Sadness: They describe feeling depressed, low in spirits, or\u003cbr\u003edespondent, regardless of whether this is visible in their appearance.\u003cbr\u003eThey may report feeling beyond help or without hope. Their mood may be\u003cbr\u003einfluenced by external circumstances to varying degrees, or it may\u003cbr\u003efeel continuous and unvarying."],["madrs-3,mood","Inner Tension: They experience feelings of ill-defined discomfort,\u003cbr\u003eedginess, or inner turmoil. This mental tension can escalate to\u003cbr\u003efeelings of panic, dread, or anguish. They may seek reassurance and\u003cbr\u003efind it difficult to master these feelings on their own."],["madrs-4,mood","Concentration Difficulties: They have difficulty collecting their\u003cbr\u003ethoughts or sustaining concentration. This may interfere with their\u003cbr\u003eability to read, hold a conversation, or complete tasks that require\u003cbr\u003efocused attention."],["madrs-5,mood","Inability to Feel: They experience reduced interest in their\u003cbr\u003esurroundings or in activities that would normally bring them pleasure.\u003cbr\u003eTheir ability to react with appropriate emotion to circumstances or\u003cbr\u003epeople feels diminished. They may feel emotionally numb or\u003cbr\u003edisconnected from friends and loved ones, struggling to feel anger,\u003cbr\u003egrief, or joy."],["madrs-6,mood","Pessimistic Thoughts: They experience thoughts of guilt, inferiority,\u003cbr\u003eself-reproach, or remorse. They may engage in self-accusations or feel\u003cbr\u003eincreasingly pessimistic about the future, dwelling on ideas of\u003cbr\u003efailure, sin, or ruin."],["phq-9-1,mood","They have little interest or pleasure in doing things."],["phq-9-2,mood","They feel down, depressed, or hopeless."],["phq-9-3,mood","They feel bad about themselves, or feel like a failure, or feel they\u003cbr\u003ehave let themselves or their family down."],["phq-9-4,mood","They have trouble concentrating on things, such as reading the\u003cbr\u003enewspaper or watching television."],["proceed-1,mood","Perception of Self: This person often feels that others are against\u003cbr\u003ethem or out to get them. They experience a profound sense of\u003cbr\u003eisolation, as though they are fundamentally alone in the world. They\u003cbr\u003ecarry a belief that they are a burden to those around them and feel\u003cbr\u003ethat others do not truly understand them. They struggle with\u003cbr\u003econfidence in their own abilities and hold a diminished view of their\u003cbr\u003eown worth. At times, they feel disconnected from themselves or their\u003cbr\u003esurroundings, and they may have difficulty recognizing\u003cbr\u003ethemselves\u2014whether in the mirror or in terms of who they feel they are\u003cbr\u003eas a person."],["proceed-2,mood","Cognitive Symptoms: This person finds it difficult to feel motivated\u003cbr\u003eor to maintain interest in activities. They believe their condition is\u003cbr\u003euntreatable and hold a generally pessimistic view of situations. Their\u003cbr\u003ethinking tends to be distorted, often interpreting events in\u003cbr\u003enegatively skewed ways. They struggle to make decisions and have\u003cbr\u003edifficulty with planning, organizing, and following through on tasks.\u003cbr\u003eAdapting to new information or shifting between tasks is challenging\u003cbr\u003efor them. They find it hard to solve problems effectively and\u003cbr\u003eexperience lapses in memory. Maintaining focus and concentration is\u003cbr\u003edifficult, as is managing their time. Their perception of time may\u003cbr\u003efeel altered\u2014either dragging or slipping away. They have trouble\u003cbr\u003eenvisioning a positive future and tend to dwell on negative thoughts\u003cbr\u003erepeatedly. Their thinking often feels foggy or unclear. They may have\u003cbr\u003ereduced capacity to understand or share in others' feelings and show\u003cbr\u003ediminished interest in social connection."],["proceed-3,mood","Mood and Emotional Symptoms: This person experiences significant\u003cbr\u003epsychological pain and a pervasive sense that things will not improve.\u003cbr\u003eThey feel powerless to change their circumstances and see themselves\u003cbr\u003eas having little value. A general sense of feeling bad pervades their\u003cbr\u003eexperience, often accompanied by guilt. Sadness is a frequent\u003cbr\u003ecompanion, along with feelings of anxiety and a fear of failing at\u003cbr\u003ethings they attempt. They often feel restless and on edge, becoming\u003cbr\u003eeasily irritated and frustrated. They have difficulty managing their\u003cbr\u003eemotions and controlling their impulses. Their mood may not shift\u003cbr\u003eappropriately in response to positive events. They have lost their\u003cbr\u003esense of humor and find little or no pleasure in activities they once\u003cbr\u003eenjoyed. They often feel empty inside, and their emotional responses\u003cbr\u003ein general feel muted or dulled."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#0072B2","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Mood, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"ACDTGP4p8T8Amm3hjLvtPwDIcjr0peo\u002fAGbLyurK5j8AquIjNpThPwCXOqbKtPE\u002fABJoVYBR5j8AFuK+Rd\u002fmPwC+hxMmhOs\u002fANwZ71h04T8AqFLl9\u002fjsPwARW4j+GPM\u002fACAcK1RtsL8AAMvcrdqlPwByuOqwz+M\u002fAJAL36Uzvr8AzJeyyiz1PwCYIj\u002fM6\u002fM\u002fAM\u002fNFFDs9D8="},"y":{"dtype":"f8","bdata":"AGCeko7Shj8AoHP5z0m9vwB6YfOgkcS\u002fAMJxcPdryT8AsGKiC+KyPwAQa2xq\u002f8o\u002fADCx\u002fQ2UmL8AoE6k+qinPwBgaCYLArM\u002fAFguHmn61j8ASLAGHMa2vwDwKWde2ra\u002fAKyReOTs0b8A0onr9tHovwBwpRnfuNK\u002fAADT8yvFYr8AgMeGnHjBvwAc0fb0qbQ\u002fAEgmCWO3pL8="},"z":{"dtype":"f8","bdata":"AMDZ8MUBub8AqC68moDGPwDAFEeAUtQ\u002fACAKcJwvuj8ApEphgmjXPwCkufi04tO\u002fANhMTP3b0z8AqEqw2ILKPwBAHUgT968\u002fABAmGwN4vT8A4HuFUBTGPwAQQBRPWr6\u002fAHpgk38g9T8AjDhowgL7PwDGSY\u002f8a+Q\u002fAKG3h2Am8j8AGFs+217IvwBE66Wyf9O\u002fAAjSu\u002f3kz78="},"type":"scatter3d"},{"customdata":[["dsm-5,somatic","They experience noticeable changes in weight\u2014either losing or\u003cbr\u003egaining\u2014without intentionally trying to diet, along with shifts in\u003cbr\u003etheir appetite. Their sleep is disrupted, with difficulty falling or\u003cbr\u003estaying asleep, or alternatively, sleeping far more than usual. Others\u003cbr\u003ecan observe changes in their physical movements and behavior: they may\u003cbr\u003eappear restless and agitated, or conversely, slowed down in their\u003cbr\u003espeech and actions. They feel persistently tired and lack the energy\u003cbr\u003ethey once had."],["ham-d-1,somatic","Initial Insomnia: The person has difficulty falling asleep at the\u003cbr\u003ebeginning of the night."],["ham-d-10,somatic","Hypochondriasis: The person shows excessive focus on their body and\u003cbr\u003ehealth, ranging from bodily self-absorption to preoccupation with\u003cbr\u003ehealth concerns, a tendency to complain about physical ailments, or\u003cbr\u003efixed false beliefs about having a serious illness."],["ham-d-11,somatic","Weight Loss: The person has experienced a noticeable decrease in body\u003cbr\u003eweight."],["ham-d-2,somatic","Middle Insomnia: The person feels restless and disturbed during the\u003cbr\u003enight, often waking up during sleeping hours."],["ham-d-3,somatic","Delayed Insomnia: The person wakes up in the early hours of the\u003cbr\u003emorning and is unable to fall asleep again."],["ham-d-4,somatic","Retardation: The person experiences slowness in their thought\u003cbr\u003eprocesses, speech, and physical activity. They may appear apathetic\u003cbr\u003eor, in more pronounced cases, enter a state of stupor."],["ham-d-5,somatic","Agitation: The person displays restlessness that is associated with\u003cbr\u003efeelings of anxiety."],["ham-d-6,somatic","Somatic Anxiety: The person experiences physical symptoms related to\u003cbr\u003eanxiety, which may include gastrointestinal issues such as\u003cbr\u003eindigestion, cardiovascular symptoms like palpitations, headaches,\u003cbr\u003erespiratory difficulties, or genito-urinary complaints."],["ham-d-7,somatic","Gastrointestinal Somatic Symptoms: The person experiences a loss of\u003cbr\u003eappetite, a heavy feeling in the abdomen, or constipation."],["ham-d-8,somatic","General Somatic Symptoms: The person feels heaviness in their limbs,\u003cbr\u003eback, or head, and may experience diffuse backaches, a loss of energy,\u003cbr\u003eor easy fatiguability."],["ham-d-9,somatic","Genital Symptoms: The person experiences a loss of libido or, in the\u003cbr\u003ecase of women, menstrual disturbances."],["icd-10,somatic","They experience changes in their appetite\u2014either eating much less or\u003cbr\u003emuch more than usual\u2014which leads to noticeable weight loss or gain.\u003cbr\u003eTheir sleep is disrupted; they may struggle to fall or stay asleep, or\u003cbr\u003econversely find themselves sleeping far more than normal. Even minimal\u003cbr\u003eeffort leaves them feeling tired and drained, as though their energy\u003cbr\u003ehas been depleted. Their physical movements and behavior have also\u003cbr\u003echanged\u2014they may appear restless and agitated, or alternatively seem\u003cbr\u003eslowed down in their speech and actions."],["madrs-1,somatic","Reduced sleep: They experience a reduction in the duration or depth of\u003cbr\u003etheir sleep compared to their usual pattern when feeling well. This\u003cbr\u003emay manifest as difficulty falling asleep, lighter or more fitful\u003cbr\u003esleep, sleep that is broken or shortened by several hours, or sleeping\u003cbr\u003eonly a few hours per night."],["madrs-2,somatic","Reduced appetite: They experience a diminished appetite compared to\u003cbr\u003ewhen they are well. This presents as a decreased desire for food or a\u003cbr\u003eneed to force themselves to eat. Food may seem tasteless, and they may\u003cbr\u003erequire encouragement or persuasion from others to eat at all."],["madrs-3,somatic","Lassitude: They have difficulty getting started with activities and\u003cbr\u003eexperience slowness in initiating and performing everyday tasks.\u003cbr\u003eRoutine activities require considerable effort to begin and carry out,\u003cbr\u003eand in more pronounced cases, they may feel unable to do anything\u003cbr\u003ewithout assistance from others."],["phq-9-1,somatic","They have trouble falling asleep, staying asleep, or sleep too much."],["phq-9-2,somatic","They feel tired or have little energy."],["phq-9-3,somatic","They have a poor appetite or overeat."],["phq-9-4,somatic","They move or speak so slowly that other people could have noticed, or\u003cbr\u003ethe opposite\u2014they are so fidgety or restless that they have been\u003cbr\u003emoving around a lot more than usual."],["proceed-1,somatic","Physical symptoms: They experience pain or other physical symptoms.\u003cbr\u003eTheir appetite or weight has changed. They have difficulty with sexual\u003cbr\u003efunction."],["proceed-2,somatic","Sleep: They sleep excessively. Their sleep is disturbed or restless.\u003cbr\u003eThey have difficulty falling or staying asleep."],["proceed-3,somatic","Psychomotor and expression: They cry. They speak very little or not at\u003cbr\u003eall. Their facial expressions appear flat or diminished. Their\u003cbr\u003emovements and reactions are slowed."],["proceed-4,somatic","Energy: They feel that everything requires effort. They feel\u003cbr\u003ephysically weak. They have low energy. They feel fatigued or tired."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#009E73","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Somatic, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"AMDFywm+qj8ARljhz57jvwCEAXfhdtg\u002fAE66OxuA5b8AMH246QjYvwAoiTbmwuK\u002fAEDyljCt2D8AwA2MGTOzPwCwjY+FYco\u002fAIhlghL8yb8AJOoHUqbQPwBgqBIKItK\u002fADjKhVayyD8AgEt0167GvwCgXlMG160\u002fAKArGET43D8AyuBI2RbvvwBoimH7aN6\u002fAE53boHz7b8AQA\u002f20Fi+vwCoFOG81Mu\u002fAKIK9eWI4L8AoMAE3B+sPwBslUoCC9E\u002f"},"y":{"dtype":"f8","bdata":"wPzrE5+38T8A5OXec\u002fn0PwBEjRXn8uE\u002fAOcefTF+7T+A6HIYYUryP0Bs+yKh2PU\u002fgG\u002fNU5Bh7j8AG05RzArfP4CI\u002f3XRDPY\u002fACpeQG\u002fZ8j8AoD+KMXPyP0AMIhBQ4vE\u002fQOXiSVY59D9A7JaPh5z1PwAM0qVBUO8\u002fgOhd5gB94z8AsfayfpbsPwAaDod8Wtc\u002fAKhm\u002fmZi1j8AOz6F2UToP4BdDVRxiu0\u002fAN4XA6da8z8AoXPWhSbgPwCCf6YaWN4\u002f"},"z":{"dtype":"f8","bdata":"AMhEbM64xb8A3I5Pyp7VPwBwChHCIbA\u002fAMaKx1Hs6D8AKBB4kCTQPwB4yUqTzc0\u002fACAKf\u002fhG1L8AeBED4L7aPwDcIGwXhuG\u002fAMDghoB7rD8AoHOt873ZvwAACSSoicY\u002fAPB99ciD3b8A0OjznF3GvwBgDY3HR6m\u002fABDyW889uL8Au5bK3tLwPwDTsI57dPE\u002fAEs3bP\u002fv+D8AVMDyYZXVPwBwAUYkCdM\u002fADym92Gj0T8AuBk70o\u002fcPwCAmK\u002f2p9E\u002f"},"type":"scatter3d"},{"customdata":[["dsm-5,suicidality","The person frequently thinks about death, beyond simply fearing dying.\u003cbr\u003eThey may have recurring thoughts of suicide without a specific plan,\u003cbr\u003eor they may have attempted suicide or developed a specific plan for\u003cbr\u003ecommitting suicide."],["ham-d,suicidality","The person may experience thoughts related to not wanting to live.\u003cbr\u003eThis can include feeling that life is not worth living, wishing they\u003cbr\u003ewere dead, having suicidal ideas or making suicidal gestures, or\u003cbr\u003eattempting suicide."],["icd-10,suicidality","They experience recurring thoughts about death or have engaged in\u003cbr\u003esuicidal behavior."],["madrs-1,suicidality","This person has expressed feelings that life is not worth living and\u003cbr\u003ehas indicated that a natural death would be welcome. They may feel\u003cbr\u003eweary of life, with fleeting or recurring thoughts of suicide."],["madrs-2,suicidality","At times, they may believe they would be better off dead, viewing\u003cbr\u003esuicide as a possible solution, though not necessarily with specific\u003cbr\u003eplans or intention."],["madrs-3,suicidality","They experience suicidal thoughts and may have made preparations for\u003cbr\u003esuicide. In some cases, they may have explicit plans for suicide or\u003cbr\u003emay be actively preparing for it."],["phq-9,suicidality","They have thoughts that they would be better off dead or of hurting\u003cbr\u003ethemselves in some way."],["proceed,suicidality","Autoaggression symptoms: The individual experiences thoughts related\u003cbr\u003eto their desire to continue living. They report suicidal ideation and\u003cbr\u003eengage in self-harming behaviors. They have attempted suicide."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#D55E00","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Suicidality, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"AABwslFEbz8ATBxPBaXQPwBQoqMADOC\u002fAADToOi1sL8AwOOwg0unvwCA2MHWHLC\u002fAEBgc3SVsb8AwM+MGIy0Pw=="},"y":{"dtype":"f8","bdata":"AOABTqPgpz8AMK5cXuOpPwBad3TQm9G\u002fAHg\u002fzT0m278AcHPeHyGqvwAik+2GBdI\u002fAMDQVzIUyD8ADFmvTg3BPw=="},"z":{"dtype":"f8","bdata":"AHQdseLR7T8ANrdXF0jmPwDzg7GijPw\u002fAFEPYv1E+D8Aog91eR3xPwDqy8sEneg\u002fADLLGa5o6z8AfMvUNvXpPw=="},"type":"scatter3d"},{"customdata":[["dv-1-1,mood","(text withheld: not redistributable)"],["dv-1-10,mood","(text withheld: not redistributable)"],["dv-1-2,mood","(text withheld: not redistributable)"],["dv-1-3,mood","(text withheld: not redistributable)"],["dv-1-4,mood","(text withheld: not redistributable)"],["dv-1-5,mood","(text withheld: not redistributable)"],["dv-1-6,mood","(text withheld: not redistributable)"],["dv-1-7,mood","(text withheld: not redistributable)"],["dv-1-8,mood","(text withheld: not redistributable)"],["dv-1-9,mood","(text withheld: not redistributable)"],["dv-2-1,mood","(text withheld: not redistributable)"],["dv-2-2,mood","(text withheld: not redistributable)"],["dv-2-3,mood","(text withheld: not redistributable)"],["dv-2-4,mood","(text withheld: not redistributable)"],["dv-3-1,mood","(text withheld: not redistributable)"],["dv-3-2,mood","(text withheld: not redistributable)"],["dv-4-1,mood","(text withheld: not redistributable)"],["dv-4-2,mood","(text withheld: not redistributable)"],["dv-4-3,mood","(text withheld: not redistributable)"],["dv-4-4,mood","(text withheld: not redistributable)"],["dv-4-5,mood","(text withheld: not redistributable)"],["dv-4-6,mood","(text withheld: not redistributable)"],["dv-4-7,mood","(text withheld: not redistributable)"],["dv-5-1, SPk8b0us\u002fAHMsAse48T8A14\u002fbQN8AQAC+6PJD4\u002fg\u002fgNLEaY9ZAUAAFCcWaSr6P4ASN6Js3wBAAKfg8ERO\u002fj8AxRDVQp3wPwC9t9RkoP0\u002fAPIhy9z59D8AXXBIlbUEQADWS0Hcx\u002fA\u002fALBqcZyS5z8ASeY3DHADQIBqFudX\u002fAdAAMWGec1T+D8AUZvurxIAQACUBxob3PQ\u002fAK8cN1G6+D8Ayw0YI9PwPwAhTqwnS\u002fY\u002fACQ6UBp95T8A0PkUwnf2PwD27ZDbNwBAAGR1JRh46j8AcwIQeMb5P4Ala2djVwBAgHoSeoeVA0AA\u002f5rpkIzzPwBXHnTjo\u002f4\u002f"},"type":"scatter3d"},{"customdata":[["dsm-5,mood","This person experiences a depressed mood, feeling sad, empty, or\u003cbr\u003ehopeless, and may appear tearful to others. They have lost interest or\u003cbr\u003epleasure in activities they used to enjoy. They struggle with feelings\u003cbr\u003eof worthlessness or carry excessive or inappropriate guilt that goes\u003cbr\u003ebeyond normal self-criticism. They also have difficulty thinking\u003cbr\u003eclearly, concentrating, or making decisions."],["ham-d-1,mood","Depressed Mood: They have a gloomy attitude and feel pessimistic about\u003cbr\u003ethe future. They experience persistent feelings of sadness and may\u003cbr\u003ehave a tendency to weep."],["ham-d-2,mood","Feelings of Guilt: They engage in self-reproach and feel they have let\u003cbr\u003epeople down. They experience ideas of guilt, and may believe their\u003cbr\u003epresent illness is a punishment. In some cases, they may have\u003cbr\u003edelusions or hallucinations related to guilt."],["ham-d-3,mood","Work and Interests: They experience feelings of incapacity,\u003cbr\u003elistlessness, indecision, and vacillation. They have lost interest in\u003cbr\u003ehobbies and show decreased social activities. Their productivity has\u003cbr\u003edecreased, and they may be unable to work due to their present\u003cbr\u003eillness."],["ham-d-4,mood","Anxiety (Psychic): They experience tension and irritability. They\u003cbr\u003eworry about minor matters and have an apprehensive attitude. They may\u003cbr\u003eexperience fears."],["icd-10,mood","They experience a persistently low mood throughout the day, which\u003cbr\u003eothers may also observe. They have lost interest or pleasure in\u003cbr\u003eactivities they would normally enjoy. They struggle with feelings of\u003cbr\u003eworthlessness and carry excessive or inappropriate guilt. Their\u003cbr\u003eability to think clearly or concentrate is diminished, and they often\u003cbr\u003efeel indecisive. Their self-confidence and self-esteem are reduced."],["madrs-1,mood","Apparent Sadness: They appear despondent, gloomy, or in despair\u2014beyond\u003cbr\u003eordinary low spirits. This is reflected in their speech, facial\u003cbr\u003eexpression, and posture. They may look dispirited or unhappy, and at\u003cbr\u003etimes struggle to brighten up even when circumstances might warrant\u003cbr\u003eit."],["madrs-2,mood","Reported Sadness: They describe feeling depressed, low in spirits, or\u003cbr\u003edespondent, regardless of whether this is visible in their appearance.\u003cbr\u003eThey may report feeling beyond help or without hope. Their mood may be\u003cbr\u003einfluenced by external circumstances to varying degrees, or it may\u003cbr\u003efeel continuous and unvarying."],["madrs-3,mood","Inner Tension: They experience feelings of ill-defined discomfort,\u003cbr\u003eedginess, or inner turmoil. This mental tension can escalate to\u003cbr\u003efeelings of panic, dread, or anguish. They may seek reassurance and\u003cbr\u003efind it difficult to master these feelings on their own."],["madrs-4,mood","Concentration Difficulties: They have difficulty collecting their\u003cbr\u003ethoughts or sustaining concentration. This may interfere with their\u003cbr\u003eability to read, hold a conversation, or complete tasks that require\u003cbr\u003efocused attention."],["madrs-5,mood","Inability to Feel: They experience reduced interest in their\u003cbr\u003esurroundings or in activities that would normally bring them pleasure.\u003cbr\u003eTheir ability to react with appropriate emotion to circumstances or\u003cbr\u003epeople feels diminished. They may feel emotionally numb or\u003cbr\u003edisconnected from friends and loved ones, struggling to feel anger,\u003cbr\u003egrief, or joy."],["madrs-6,mood","Pessimistic Thoughts: They experience thoughts of guilt, inferiority,\u003cbr\u003eself-reproach, or remorse. They may engage in self-accusations or feel\u003cbr\u003eincreasingly pessimistic about the future, dwelling on ideas of\u003cbr\u003efailure, sin, or ruin."],["phq-9-1,mood","They have little interest or pleasure in doing things."],["phq-9-2,mood","They feel down, depressed, or hopeless."],["phq-9-3,mood","They feel bad about themselves, or feel like a failure, or feel they\u003cbr\u003ehave let themselves or their family down."],["phq-9-4,mood","They have trouble concentrating on things, such as reading the\u003cbr\u003enewspaper or watching television."],["proceed-1,mood","Perception of Self: This person often feels that others are against\u003cbr\u003ethem or out to get them. They experience a profound sense of\u003cbr\u003eisolation, as though they are fundamentally alone in the world. They\u003cbr\u003ecarry a belief that they are a burden to those around them and feel\u003cbr\u003ethat others do not truly understand them. They struggle with\u003cbr\u003econfidence in their own abilities and hold a diminished view of their\u003cbr\u003eown worth. At times, they feel disconnected from themselves or their\u003cbr\u003esurroundings, and they may have difficulty recognizing\u003cbr\u003ethemselves\u2014whether in the mirror or in terms of who they feel they are\u003cbr\u003eas a person."],["proceed-2,mood","Cognitive Symptoms: This person finds it difficult to feel motivated\u003cbr\u003eor to maintain interest in activities. They believe their condition is\u003cbr\u003euntreatable and hold a generally pessimistic view of situations. Their\u003cbr\u003ethinking tends to be distorted, often interpreting events in\u003cbr\u003enegatively skewed ways. They struggle to make decisions and have\u003cbr\u003edifficulty with planning, organizing, and following through on tasks.\u003cbr\u003eAdapting to new information or shifting between tasks is challenging\u003cbr\u003efor them. They find it hard to solve problems effectively and\u003cbr\u003eexperience lapses in memory. Maintaining focus and concentration is\u003cbr\u003edifficult, as is managing their time. Their perception of time may\u003cbr\u003efeel altered\u2014either dragging or slipping away. They have trouble\u003cbr\u003eenvisioning a positive future and tend to dwell on negative thoughts\u003cbr\u003erepeatedly. Their thinking often feels foggy or unclear. They may have\u003cbr\u003ereduced capacity to understand or share in others' feelings and show\u003cbr\u003ediminished interest in social connection."],["proceed-3,mood","Mood and Emotional Symptoms: This person experiences significant\u003cbr\u003epsychological pain and a pervasive sense that things will not improve.\u003cbr\u003eThey feel powerless to change their circumstances and see themselves\u003cbr\u003eas having little value. A general sense of feeling bad pervades their\u003cbr\u003eexperience, often accompanied by guilt. Sadness is a frequent\u003cbr\u003ecompanion, along with feelings of anxiety and a fear of failing at\u003cbr\u003ethings they attempt. They often feel restless and on edge, becoming\u003cbr\u003eeasily irritated and frustrated. They have difficulty managing their\u003cbr\u003eemotions and controlling their impulses. Their mood may not shift\u003cbr\u003eappropriately in response to positive events. They have lost their\u003cbr\u003esense of humor and find little or no pleasure in activities they once\u003cbr\u003eenjoyed. They often feel empty inside, and their emotional responses\u003cbr\u003ein general feel muted or dulled."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#0072B2","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Mood, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"AN5WdBBe8T8AaBDoYJbsPwBkxWAjZeg\u002fAMRSEzdG5j8AmH1pA2vkPwBm9ZPqtPA\u002fAIjgoXV56T8AXHkB5qbnPwBk8chwNe4\u002fADTa5kmy5D8AzJUAdHvwPwCkmk40RO8\u002fABDoSTjXxj8AvFVlTfvgPwA40gfN6Oc\u002fAJCWnJBcxT8ARGKJg2TzPwB+a3nHyfM\u002fAOD0Poti9D8="},"y":{"dtype":"f8","bdata":"ABCAtQMhu78AAFMkTlJ4PwCg1Gtfj6u\u002fANSwqWk40T8AONhrJ7bYPwAA6CuK8Y8\u002fAGDDjpzLzz8A4F5+Osi5PwBw5DDlXcI\u002fADRUPzi93T8AAMyp1jujPwBgq45NSMa\u002fAEz80V0M1j8AsIGTO2DMPwAAxw7WjLm\u002fALbHJ5qr5D8A1HZsud3RvwAQ7nxOl7e\u002fAOgsNRgUwL8="},"z":{"dtype":"f8","bdata":"AABYFQGRUD8AQFn\u002fTde5PwCYCYSgF9E\u002fAADdNARtjz8AAJxHtD6gvwAAMyy7cK+\u002fAIDWptSIp78AgAtppZq\u002fPwCApQEBDbm\u002fAEBuN4oGtb8AwBzyooCxvwDw9p3fFsc\u002fAPATrgDv3z8AkK2iE2PLPwBItCdc6tU\u002fAOC8JfN3yz8AgKr67GmtPwCAhcAHI7+\u002fAED1cfytv78="},"type":"scatter3d"},{"customdata":[["dsm-5,somatic","They experience noticeable changes in weight\u2014either losing or\u003cbr\u003egaining\u2014without intentionally trying to diet, along with shifts in\u003cbr\u003etheir appetite. Their sleep is disrupted, with difficulty falling or\u003cbr\u003estaying asleep, or alternatively, sleeping far more than usual. Others\u003cbr\u003ecan observe changes in their physical movements and behavior: they may\u003cbr\u003eappear restless and agitated, or conversely, slowed down in their\u003cbr\u003espeech and actions. They feel persistently tired and lack the energy\u003cbr\u003ethey once had."],["ham-d-1,somatic","Initial Insomnia: The person has difficulty falling asleep at the\u003cbr\u003ebeginning of the night."],["ham-d-10,somatic","Hypochondriasis: The person shows excessive focus on their body and\u003cbr\u003ehealth, ranging from bodily self-absorption to preoccupation with\u003cbr\u003ehealth concerns, a tendency to complain about physical ailments, or\u003cbr\u003efixed false beliefs about having a serious illness."],["ham-d-11,somatic","Weight Loss: The person has experienced a noticeable decrease in body\u003cbr\u003eweight."],["ham-d-2,somatic","Middle Insomnia: The person feels restless and disturbed during the\u003cbr\u003enight, often waking up during sleeping hours."],["ham-d-3,somatic","Delayed Insomnia: The person wakes up in the early hours of the\u003cbr\u003emorning and is unable to fall asleep again."],["ham-d-4,somatic","Retardation: The person experiences slowness in their thought\u003cbr\u003eprocesses, speech, and physical activity. They may appear apathetic\u003cbr\u003eor, in more pronounced cases, enter a state of stupor."],["ham-d-5,somatic","Agitation: The person displays restlessness that is associated with\u003cbr\u003efeelings of anxiety."],["ham-d-6,somatic","Somatic Anxiety: The person experiences physical symptoms related to\u003cbr\u003eanxiety, which may include gastrointestinal issues such as\u003cbr\u003eindigestion, cardiovascular symptoms like palpitations, headaches,\u003cbr\u003erespiratory difficulties, or genito-urinary complaints."],["ham-d-7,somatic","Gastrointestinal Somatic Symptoms: The person experiences a loss of\u003cbr\u003eappetite, a heavy feeling in the abdomen, or constipation."],["ham-d-8,somatic","General Somatic Symptoms: The person feels heaviness in their limbs,\u003cbr\u003eback, or head, and may experience diffuse backaches, a loss of energy,\u003cbr\u003eor easy fatiguability."],["ham-d-9,somatic","Genital Symptoms: The person experiences a loss of libido or, in the\u003cbr\u003ecase of women, menstrual disturbances."],["icd-10,somatic","They experience changes in their appetite\u2014either eating much less or\u003cbr\u003emuch more than usual\u2014which leads to noticeable weight loss or gain.\u003cbr\u003eTheir sleep is disrupted; they may struggle to fall or stay asleep, or\u003cbr\u003econversely find themselves sleeping far more than normal. Even minimal\u003cbr\u003eeffort leaves them feeling tired and drained, as though their energy\u003cbr\u003ehas been depleted. Their physical movements and behavior have also\u003cbr\u003echanged\u2014they may appear restless and agitated, or alternatively seem\u003cbr\u003eslowed down in their speech and actions."],["madrs-1,somatic","Reduced sleep: They experience a reduction in the duration or depth of\u003cbr\u003etheir sleep compared to their usual pattern when feeling well. This\u003cbr\u003emay manifest as difficulty falling asleep, lighter or more fitful\u003cbr\u003esleep, sleep that is broken or shortened by several hours, or sleeping\u003cbr\u003eonly a few hours per night."],["madrs-2,somatic","Reduced appetite: They experience a diminished appetite compared to\u003cbr\u003ewhen they are well. This presents as a decreased desire for food or a\u003cbr\u003eneed to force themselves to eat. Food may seem tasteless, and they may\u003cbr\u003erequire encouragement or persuasion from others to eat at all."],["madrs-3,somatic","Lassitude: They have difficulty getting started with activities and\u003cbr\u003eexperience slowness in initiating and performing everyday tasks.\u003cbr\u003eRoutine activities require considerable effort to begin and carry out,\u003cbr\u003eand in more pronounced cases, they may feel unable to do anything\u003cbr\u003ewithout assistance from others."],["phq-9-1,somatic","They have trouble falling asleep, staying asleep, or sleep too much."],["phq-9-2,somatic","They feel tired or have little energy."],["phq-9-3,somatic","They have a poor appetite or overeat."],["phq-9-4,somatic","They move or speak so slowly that other people could have noticed, or\u003cbr\u003ethe opposite\u2014they are so fidgety or restless that they have been\u003cbr\u003emoving around a lot more than usual."],["proceed-1,somatic","Physical symptoms: They experience pain or other physical symptoms.\u003cbr\u003eTheir appetite or weight has changed. They have difficulty with sexual\u003cbr\u003efunction."],["proceed-2,somatic","Sleep: They sleep excessively. Their sleep is disturbed or restless.\u003cbr\u003eThey have difficulty falling or staying asleep."],["proceed-3,somatic","Psychomotor and expression: They cry. They speak very little or not at\u003cbr\u003eall. Their facial expressions appear flat or diminished. Their\u003cbr\u003emovements and reactions are slowed."],["proceed-4,somatic","Energy: They feel that everything requires effort. They feel\u003cbr\u003ephysically weak. They have low energy. They feel fatigued or tired."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#009E73","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Somatic, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"ABCXIYvpwD8AcNwMLDjivwBAN3Wt0d4\u002fAKwbA3Wo478A4D0K1FTbvwCAP5VTKOK\u002fAEBkoaBgxj8AQFdoJk63PwDAqFfnhK0\u002fADCuHufqyL8AwD2bIzmvPwAoqeJ5k9e\u002fAIBan3KPxT8AoB+rQRbNvwBgYm9Irr0\u002fAMCM5Om52j8AzGX8Q2zjvwDgIOBcOb6\u002fACyrhhDH5b8AgBi8yO3FvwCAUSj6XLm\u002fABQ0hGtV4L8AQL9J1kHAPwDI+UNsl9M\u002f"},"y":{"dtype":"f8","bdata":"APoncxbT7T8AIcDszd74PwDARl0\u002fKdo\u002fAJv3vX\u002fO9T8AgsuJUXb3PwBgW8lCFfk\u002fAKSkVwQ96z8AVuhh1pDoPwCSzdnAV+8\u002fAAqDdNXa8z8AjdHYDCDxPwALNFngMvQ\u002fAABNqekd7j8AS5qDSpn0PwDiLG636ek\u002fANYkXfhC4j8AeXww+RT3PwCc\u002ffBmVu0\u002fAE8HdssP9T8AnDTTUi\u002fuPwAhgxYRbPA\u002fACKYUkIy+D8AaGsvWHjtPwCWyK614Os\u002f"},"z":{"dtype":"f8","bdata":"AEAaYqUwsL8AgA87h1SnPwBA\u002fDFEW7w\u002fAKCmR6Q8zz8AAJjYsTegvwAADMDi+os\u002fAADIz\u002fSteL8AANTo6hy3PwAAO7ywHKK\u002fAAA+ox01rb8A0Gd1Ex7FvwDA0q+W7cI\u002fAIBqgtraub8AAA+IvjW1vwBAw0Z5MrU\u002fAIBgQmYrnL8AAFZmiWjJPwCwhSd3x8I\u002fAFBg4ka62T8AwNHtWqTJPwCA\u002fW1mD7c\u002fAADA0xLwTb8AAGdcBg2evwAAr6pWAcG\u002f"},"type":"scatter3d"},{"customdata":[["dsm-5,suicidality","The person frequently thinks about death, beyond simply fearing dying.\u003cbr\u003eThey may have recurring thoughts of suicide without a specific plan,\u003cbr\u003eor they may have attempted suicide or developed a specific plan for\u003cbr\u003ecommitting suicide."],["ham-d,suicidality","The person may experience thoughts related to not wanting to live.\u003cbr\u003eThis can include feeling that life is not worth living, wishing they\u003cbr\u003ewere dead, having suicidal ideas or making suicidal gestures, or\u003cbr\u003eattempting suicide."],["icd-10,suicidality","They experience recurring thoughts about death or have engaged in\u003cbr\u003esuicidal behavior."],["madrs-1,suicidality","This person has expressed feelings that life is not worth living and\u003cbr\u003ehas indicated that a natural death would be welcome. They may feel\u003cbr\u003eweary of life, with fleeting or recurring thoughts of suicide."],["madrs-2,suicidality","At times, they may believe they would be better off dead, viewing\u003cbr\u003esuicide as a possible solution, though not necessarily with specific\u003cbr\u003eplans or intention."],["madrs-3,suicidality","They experience suicidal thoughts and may have made preparations for\u003cbr\u003esuicide. In some cases, they may have explicit plans for suicide or\u003cbr\u003emay be actively preparing for it."],["phq-9,suicidality","They have thoughts that they would be better off dead or of hurting\u003cbr\u003ethemselves in some way."],["proceed,suicidality","Autoaggression symptoms: The individual experiences thoughts related\u003cbr\u003eto their desire to continue living. They report suicidal ideation and\u003cbr\u003eengage in self-harming behaviors. They have attempted suicide."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":" le with feelings of\u003cbr\u003eworthlessness and carry excessive or inappropriate guilt. Their\u003cbr\u003eability to think clearly or concentrate is diminished, and they often\u003cbr\u003efeel indecisive. Their self-confidence and self-esteem are reduced."],["madrs-1,mood","Apparent Sadness: They appear despondent, gloomy, or in despair\u2014beyond\u003cbr\u003eordinary low spirits. This is reflected in their speech, facial\u003cbr\u003eexpression, and posture. They may look dispirited or unhappy, and at\u003cbr\u003etimes struggle to brighten up even when circumstances might warrant\u003cbr\u003eit."],["madrs-2,mood","Reported Sadness: They describe feeling depressed, low in spirits, or\u003cbr\u003edespondent, regardless of whether this is visible in their appearance.\u003cbr\u003eThey may report feeling beyond help or without hope. Their mood may be\u003cbr\u003einfluenced by external circumstances to varying degrees, or it may\u003cbr\u003efeel continuous and unvarying."],["madrs-3,mood","Inner Tension: They experience feelings of ill-defined discomfort,\u003cbr\u003eedginess, or inner turmoil. This mental tension can escalate to\u003cbr\u003efeelings of panic, dread, or anguish. They may seek reassurance and\u003cbr\u003efind it difficult to master these feelings on their own."],["madrs-4,mood","Concentration Difficulties: They have difficulty collecting their\u003cbr\u003ethoughts or sustaining concentration. This may interfere with their\u003cbr\u003eability to read, hold a conversation, or complete tasks that require\u003cbr\u003efocused attention."],["madrs-5,mood","Inability to Feel: They experience reduced interest in their\u003cbr\u003esurroundings or in activities that would normally bring them pleasure.\u003cbr\u003eTheir ability to react with appropriate emotion to circumstances or\u003cbr\u003epeople feels diminished. They may feel emotionally numb or\u003cbr\u003edisconnected from friends and loved ones, struggling to feel anger,\u003cbr\u003egrief, or joy."],["madrs-6,mood","Pessimistic Thoughts: They experience thoughts of guilt, inferiority,\u003cbr\u003eself-reproach, or remorse. They may engage in self-accusations or feel\u003cbr\u003eincreasingly pessimistic about the future, dwelling on ideas of\u003cbr\u003efailure, sin, or ruin."],["phq-9-1,mood","They have little interest or pleasure in doing things."],["phq-9-2,mood","They feel down, depressed, or hopeless."],["phq-9-3,mood","They feel bad about themselves, or feel like a failure, or feel they\u003cbr\u003ehave let themselves or their family down."],["phq-9-4,mood","They have trouble concentrating on things, such as reading the\u003cbr\u003enewspaper or watching television."],["proceed-1,mood","Perception of Self: This person often feels that others are against\u003cbr\u003ethem or out to get them. They experience a profound sense of\u003cbr\u003eisolation, as though they are fundamentally alone in the world. They\u003cbr\u003ecarry a belief that they are a burden to those around them and feel\u003cbr\u003ethat others do not truly understand them. They struggle with\u003cbr\u003econfidence in their own abilities and hold a diminished view of their\u003cbr\u003eown worth. At times, they feel disconnected from themselves or their\u003cbr\u003esurroundings, and they may have difficulty recognizing\u003cbr\u003ethemselves\u2014whether in the mirror or in terms of who they feel they are\u003cbr\u003eas a person."],["proceed-2,mood","Cognitive Symptoms: This person finds it difficult to feel motivated\u003cbr\u003eor to maintain interest in activities. They believe their condition is\u003cbr\u003euntreatable and hold a generally pessimistic view of situations. Their\u003cbr\u003ethinking tends to be distorted, often interpreting events in\u003cbr\u003enegatively skewed ways. They struggle to make decisions and have\u003cbr\u003edifficulty with planning, organizing, and following through on tasks.\u003cbr\u003eAdapting to new information or shifting between tasks is challenging\u003cbr\u003efor them. They find it hard to solve problems effectively and\u003cbr\u003eexperience lapses in memory. Maintaining focus and concentration is\u003cbr\u003edifficult, as is managing their time. Their perception of time may\u003cbr\u003efeel altered\u2014either dragging or slipping away. They have trouble\u003cbr\u003eenvisioning a positive future and tend to dwell on negative thoughts\u003cbr\u003erepeatedly. Their thinking often feels foggy or unclear. They may have\u003cbr\u003ereduced capacity to understand or share in others' feelings and show\u003cbr\u003ediminished interest in social connection."],["proceed-3,mood","Mood and Emotional Symptoms: This person experiences significant\u003cbr\u003epsychological pain and a pervasive sense that things will not improve.\u003cbr\u003eThey feel powerless to change their circumstances and see themselves\u003cbr\u003eas having little value. A general sense of feeling bad pervades their\u003cbr\u003eexperience, often accompanied by guilt. Sadness is a frequent\u003cbr\u003ecompanion, along with feelings of anxiety and a fear of failing at\u003cbr\u003ethings they attempt. They often feel restless and on edge, becoming\u003cbr\u003eeasily irritated and frustrated. They have difficulty managing their\u003cbr\u003eemotions and controlling their impulses. Their mood may not shift\u003cbr\u003eappropriately in response to positive events. They have lost their\u003cbr\u003esense of humor and find little or no pleasure in activities they once\u003cbr\u003eenjoyed. They often feel empty inside, and their emotional responses\u003cbr\u003ein general feel muted or dulled."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#0072B2","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Mood, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"ALQKWZfZ8D8AEOZc3QztPwBo5z1AFuo\u002fAIi671hp5T8AkKkixPXkPwCQEjs5yPA\u002fADh5d2026D8AAA2ZPWDnPwDIG\u002fM71+4\u002fAHgpjXIC5j8AzNfsap\u002fwPwDoF2Hv2u8\u002fACDcP9oBwj8A8KlCsabhPwDg\u002f3Mijec\u002fAIDo01Vz0D8AdK0CbF30PwBIt2FjRPM\u002fADDmhlL18z8="},"y":{"dtype":"f8","bdata":"AMD2oztqtb8AwKBX8mWlvwBglXG9t7a\u002fAOBMcR3G0z8A0ILaJM\u002fUPwCALjTpRqU\u002fADBa+arWzj8AwDeunM68PwDgfTH6cbE\u002fANDB\u002fxWa3j8AgOwW6TWoPwDgSwhN9sy\u002fAOj3Yl8i3j8AoKEWTx+9PwBgsZ+krrO\u002fAKikYeLI5j8AqBGcpBnUvwDAfEodwai\u002fAJAuXcmtwL8="},"z":{"dtype":"f8","bdata":"AABQECkAVD8AQKEW7HG+PwCQOSwyGNA\u002fAAB4k4dmmj8AAMDZ5FlRvwAAK5pifrm\u002fAADoj65Xcz8AYJyfup3APwAAamM5rKW\u002fAGAiGddrwb8AQJmFHx2zvwBg1WgFk8o\u002fADAbn8X\u002f2T8A4Avr3UTTPwCwXqFmH9M\u002fAICxoYmWvj8AAMT6pIyfPwCg4DgsgMC\u002fAECh1tG\u002fub8="},"type":"scatter3d"},{"customdata":[["dsm-5,somatic","They experience noticeable changes in weight\u2014either losing or\u003cbr\u003egaining\u2014without intentionally trying to diet, along with shifts in\u003cbr\u003etheir appetite. Their sleep is disrupted, with difficulty falling or\u003cbr\u003estaying asleep, or alternatively, sleeping far more than usual. Others\u003cbr\u003ecan observe changes in their physical movements and behavior: they may\u003cbr\u003eappear restless and agitated, or conversely, slowed down in their\u003cbr\u003espeech and actions. They feel persistently tired and lack the energy\u003cbr\u003ethey once had."],["ham-d-1,somatic","Initial Insomnia: The person has difficulty falling asleep at the\u003cbr\u003ebeginning of the night."],["ham-d-10,somatic","Hypochondriasis: The person shows excessive focus on their body and\u003cbr\u003ehealth, ranging from bodily self-absorption to preoccupation with\u003cbr\u003ehealth concerns, a tendency to complain about physical ailments, or\u003cbr\u003efixed false beliefs about having a serious illness."],["ham-d-11,somatic","Weight Loss: The person has experienced a noticeable decrease in body\u003cbr\u003eweight."],["ham-d-2,somatic","Middle Insomnia: The person feels restless and disturbed during the\u003cbr\u003enight, often waking up during sleeping hours."],["ham-d-3,somatic","Delayed Insomnia: The person wakes up in the early hours of the\u003cbr\u003emorning and is unable to fall asleep again."],["ham-d-4,somatic","Retardation: The person experiences slowness in their thought\u003cbr\u003eprocesses, speech, and physical activity. They may appear apathetic\u003cbr\u003eor, in more pronounced cases, enter a state of stupor."],["ham-d-5,somatic","Agitation: The person displays restlessness that is associated with\u003cbr\u003efeelings of anxiety."],["ham-d-6,somatic","Somatic Anxiety: The person experiences physical symptoms related to\u003cbr\u003eanxiety, which may include gastrointestinal issues such as\u003cbr\u003eindigestion, cardiovascular symptoms like palpitations, headaches,\u003cbr\u003erespiratory difficulties, or genito-urinary complaints."],["ham-d-7,somatic","Gastrointestinal Somatic Symptoms: The person experiences a loss of\u003cbr\u003eappetite, a heavy feeling in the abdomen, or constipation."],["ham-d-8,somatic","General Somatic Symptoms: The person feels heaviness in their limbs,\u003cbr\u003eback, or head, and may experience diffuse backaches, a loss of energy,\u003cbr\u003eor easy fatiguability."],["ham-d-9,somatic","Genital Symptoms: The person experiences a loss of libido or, in the\u003cbr\u003ecase of women, menstrual disturbances."],["icd-10,somatic","They experience changes in their appetite\u2014either eating much less or\u003cbr\u003emuch more than usual\u2014which leads to noticeable weight loss or gain.\u003cbr\u003eTheir sleep is disrupted; they may struggle to fall or stay asleep, or\u003cbr\u003econversely find themselves sleeping far more than normal. Even minimal\u003cbr\u003eeffort leaves them feeling tired and drained, as though their energy\u003cbr\u003ehas been depleted. Their physical movements and behavior have also\u003cbr\u003echanged\u2014they may appear restless and agitated, or alternatively seem\u003cbr\u003eslowed down in their speech and actions."],["madrs-1,somatic","Reduced sleep: They experience a reduction in the duration or depth of\u003cbr\u003etheir sleep compared to their usual pattern when feeling well. This\u003cbr\u003emay manifest as difficulty falling asleep, lighter or more fitful\u003cbr\u003esleep, sleep that is broken or shortened by several hours, or sleeping\u003cbr\u003eonly a few hours per night."],["madrs-2,somatic","Reduced appetite: They experience a diminished appetite compared to\u003cbr\u003ewhen they are well. This presents as a decreased desire for food or a\u003cbr\u003eneed to force themselves to eat. Food may seem tasteless, and they may\u003cbr\u003erequire encouragement or persuasion from others to eat at all."],["madrs-3,somatic","Lassitude: They have difficulty getting started with activities and\u003cbr\u003eexperience slowness in initiating and performing everyday tasks.\u003cbr\u003eRoutine activities require considerable effort to begin and carry out,\u003cbr\u003eand in more pronounced cases, they may feel unable to do anything\u003cbr\u003ewithout assistance from others."],["phq-9-1,somatic","They have trouble falling asleep, staying asleep, or sleep too much."],["phq-9-2,somatic","They feel tired or have little energy."],["phq-9-3,somatic","They have a poor appetite or overeat."],["phq-9-4,somatic","They move or speak so slowly that other people could have noticed, or\u003cbr\u003ethe opposite\u2014they are so fidgety or restless that they have been\u003cbr\u003emoving around a lot more than usual."],["proceed-1,somatic","Physical symptoms: They experience pain or other physical symptoms.\u003cbr\u003eTheir appetite or weight has changed. They have difficulty with sexual\u003cbr\u003efunction."],["proceed-2,somatic","Sleep: They sleep excessively. Their sleep is disturbed or restless.\u003cbr\u003eThey have difficulty falling or staying asleep."],["proceed-3,somatic","Psychomotor and expression: They cry. They speak very little or not at\u003cbr\u003eall. Their facial expressions appear flat or diminished. Their\u003cbr\u003emovements and reactions are slowed."],["proceed-4,somatic","Energy: They feel that everything requires effort. They feel\u003cbr\u003ephysically weak. They have low energy. They feel fatigued or tired."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#009E73","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Somatic, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"AADukN07tD8AUL0JKwHevwCQ\u002fs2l5N4\u002fANhXPtsa4L8AcJMdXEPUvwDA6E6pN92\u002fAMAdKL7fzT8AAFLVaeK1PwAAmbRXDrA\u002fAKCA6fKTwr8AAM22jOu9PwDgshrBvNC\u002fAECkx4XZsT8AoF\u002fuDXrPvwCATONSp7M\u002fADDfCWJQ2T8AmAyjstXhvwCAjbCKwcm\u002fAKiEdwwm478AoA9RlhjHvwDAmfCuDMS\u002fAABgXG6X3b8AYA\u002f56abEPwAwq\u002fpBvtU\u002f"},"y":{"dtype":"f8","bdata":"ADhlB1T37z8AaNuOxxn2PwCAO75Pd9k\u002fALri3xRH9D8AC8o7a9r0PwDwj0ZDOfY\u002fAFh6iVHE5z8AkIyVd2HoPwC6aHevAPA\u002fAKQuGLn+8j8AXh3VGjzwPwBsXY3DJvI\u002fAOJAx10D8T8ApDfYkrr0PwAI9zY7xuw\u002fAKCKDdjj5T8AfOhSUoH1PwBDVl4\u002fBfE\u002fALCEWIBj9D8Afr5dP0vvPwAezOFcdPE\u002fAPpcLhmB9j8AvAzt\u002fZDqPwDo12Lzh+c\u002f"},"z":{"dtype":"f8","bdata":"AIBYLtkzrL8AAHL\u002fYHm4PwAgirodmcE\u002fAIBckXVdzz8AAICnkmOPvwAAtFfbOLA\u002fAAAjCaoIoj8AQJVvi1GwPwAAchsDq6+\u002fAICfgF2wrb8AQLBrSbDEvwBAeBQxKb4\u002fAMCvgpgfvb8AQKj\u002f6FewvwAAtHO3kpw\u002fAEDLRAhUt78AwIWt4frMPwCArJNjAb4\u002fADA7XIaw1z8AoEnUzSfHPwAA2QggyLY\u002fAADtSOk2lz8AAOAm199jvwAAyemYHK+\u002f"},"type":"scatter3d"},{"customdata":[["dsm-5,suicidality","The person frequently thinks about death, beyond simply fearing dying.\u003cbr\u003eThey may have recurring thoughts of suicide without a specific plan,\u003cbr\u003eor they may have attempted suicide or developed a specific plan for\u003cbr\u003ecommitting suicide."],["ham-d,suicidality","The person may experience thoughts related to not wanting to live.\u003cbr\u003eThis can include feeling that life is not worth living, wishing they\u003cbr\u003ewere dead, having suicidal ideas or making suicidal gestures, or\u003cbr\u003eattempting suicide."],["icd-10,suicidality","They experience recurring thoughts about death or have engaged in\u003cbr\u003esuicidal behavior."],["madrs-1,suicidality","This person has expressed feelings that life is not worth living and\u003cbr\u003ehas indicated that a natural death would be welcome. They may feel\u003cbr\u003eweary of life, with fleeting or recurring thoughts of suicide."],["madrs-2,suicidality","At times, they may believe they would be better off dead, viewing\u003cbr\u003esuicide as a possible solution, though not necessarily with specific\u003cbr\u003eplans or intention."],["madrs-3,suicidality","They experience suicidal thoughts and may have made preparations for\u003cbr\u003esuicide. In some cases, they may have explicit plans for suicide or\u003cbr\u003emay be actively preparing for it."],["phq-9,suicidality","They have thoughts that they would be better off dead or of hurting\u003cbr\u003ethemselves in some way."],["proceed,suicidality","Autoaggression symptoms: The individual experiences thoughts related\u003cbr\u003eto their desire to continue living. They report suicidal ideation and\u003cbr\u003eengage in self-harming behaviors. They have attempted suicide."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#D55E00","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Suicidality, Core Clinical \u00b7 In-Sample","visible":fal
