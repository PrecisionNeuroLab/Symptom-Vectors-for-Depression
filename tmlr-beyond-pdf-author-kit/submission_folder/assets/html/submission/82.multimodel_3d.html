 is a punishment. In some cases, they may have\u003cbr\u003edelusions or hallucinations related to guilt."],["ham-d-3,mood","Work and Interests: They experience feelings of incapacity,\u003cbr\u003elistlessness, indecision, and vacillation. They have lost interest in\u003cbr\u003ehobbies and show decreased social activities. Their productivity has\u003cbr\u003edecreased, and they may be unable to work due to their present\u003cbr\u003eillness."],["ham-d-4,mood","Anxiety (Psychic): They experience tension and irritability. They\u003cbr\u003eworry about minor matters and have an apprehensive attitude. They may\u003cbr\u003eexperience fears."],["icd-10,mood","They experience a persistently low mood throughout the day, which\u003cbr\u003eothers may also observe. They have lost interest or pleasure in\u003cbr\u003eactivities they would normally enjoy. They struggle with feelings of\u003cbr\u003eworthlessness and carry excessive or inappropriate guilt. Their\u003cbr\u003eability to think clearly or concentrate is diminished, and they often\u003cbr\u003efeel indecisive. Their self-confidence and self-esteem are reduced."],["madrs-1,mood","Apparent Sadness: They appear despondent, gloomy, or in despair\u2014beyond\u003cbr\u003eordinary low spirits. This is reflected in their speech, facial\u003cbr\u003eexpression, and posture. They may look dispirited or unhappy, and at\u003cbr\u003etimes struggle to brighten up even when circumstances might warrant\u003cbr\u003eit."],["madrs-2,mood","Reported Sadness: They describe feeling depressed, low in spirits, or\u003cbr\u003edespondent, regardless of whether this is visible in their appearance.\u003cbr\u003eThey may report feeling beyond help or without hope. Their mood may be\u003cbr\u003einfluenced by external circumstances to varying degrees, or it may\u003cbr\u003efeel continuous and unvarying."],["madrs-3,mood","Inner Tension: They experience feelings of ill-defined discomfort,\u003cbr\u003eedginess, or inner turmoil. This mental tension can escalate to\u003cbr\u003efeelings of panic, dread, or anguish. They may seek reassurance and\u003cbr\u003efind it difficult to master these feelings on their own."],["madrs-4,mood","Concentration Difficulties: They have difficulty collecting their\u003cbr\u003ethoughts or sustaining concentration. This may interfere with their\u003cbr\u003eability to read, hold a conversation, or complete tasks that require\u003cbr\u003efocused attention."],["madrs-5,mood","Inability to Feel: They experience reduced interest in their\u003cbr\u003esurroundings or in activities that would normally bring them pleasure.\u003cbr\u003eTheir ability to react with appropriate emotion to circumstances or\u003cbr\u003epeople feels diminished. They may feel emotionally numb or\u003cbr\u003edisconnected from friends and loved ones, struggling to feel anger,\u003cbr\u003egrief, or joy."],["madrs-6,mood","Pessimistic Thoughts: They experience thoughts of guilt, inferiority,\u003cbr\u003eself-reproach, or remorse. They may engage in self-accusations or feel\u003cbr\u003eincreasingly pessimistic about the future, dwelling on ideas of\u003cbr\u003efailure, sin, or ruin."],["phq-9-1,mood","They have little interest or pleasure in doing things."],["phq-9-2,mood","They feel down, depressed, or hopeless."],["phq-9-3,mood","They feel bad about themselves, or feel like a failure, or feel they\u003cbr\u003ehave let themselves or their family down."],["phq-9-4,mood","They have trouble concentrating on things, such as reading the\u003cbr\u003enewspaper or watching television."],["proceed-1,mood","Perception of Self: This person often feels that others are against\u003cbr\u003ethem or out to get them. They experience a profound sense of\u003cbr\u003eisolation, as though they are fundamentally alone in the world. They\u003cbr\u003ecarry a belief that they are a burden to those around them and feel\u003cbr\u003ethat others do not truly understand them. They struggle with\u003cbr\u003econfidence in their own abilities and hold a diminished view of their\u003cbr\u003eown worth. At times, they feel disconnected from themselves or their\u003cbr\u003esurroundings, and they may have difficulty recognizing\u003cbr\u003ethemselves\u2014whether in the mirror or in terms of who they feel they are\u003cbr\u003eas a person."],["proceed-2,mood","Cognitive Symptoms: This person finds it difficult to feel motivated\u003cbr\u003eor to maintain interest in activities. They believe their condition is\u003cbr\u003euntreatable and hold a generally pessimistic view of situations. Their\u003cbr\u003ethinking tends to be distorted, often interpreting events in\u003cbr\u003enegatively skewed ways. They struggle to make decisions and have\u003cbr\u003edifficulty with planning, organizing, and following through on tasks.\u003cbr\u003eAdapting to new information or shifting between tasks is challenging\u003cbr\u003efor them. They find it hard to solve problems effectively and\u003cbr\u003eexperience lapses in memory. Maintaining focus and concentration is\u003cbr\u003edifficult, as is managing their time. Their perception of time may\u003cbr\u003efeel altered\u2014either dragging or slipping away. They have trouble\u003cbr\u003eenvisioning a positive future and tend to dwell on negative thoughts\u003cbr\u003erepeatedly. Their thinking often feels foggy or unclear. They may have\u003cbr\u003ereduced capacity to understand or share in others' feelings and show\u003cbr\u003ediminished interest in social connection."],["proceed-3,mood","Mood and Emotional Symptoms: This person experiences significant\u003cbr\u003epsychological pain and a pervasive sense that things will not improve.\u003cbr\u003eThey feel powerless to change their circumstances and see themselves\u003cbr\u003eas having little value. A general sense of feeling bad pervades their\u003cbr\u003eexperience, often accompanied by guilt. Sadness is a frequent\u003cbr\u003ecompanion, along with feelings of anxiety and a fear of failing at\u003cbr\u003ethings they attempt. They often feel restless and on edge, becoming\u003cbr\u003eeasily irritated and frustrated. They have difficulty managing their\u003cbr\u003eemotions and controlling their impulses. Their mood may not shift\u003cbr\u003eappropriately in response to positive events. They have lost their\u003cbr\u003esense of humor and find little or no pleasure in activities they once\u003cbr\u003eenjoyed. They often feel empty inside, and their emotional responses\u003cbr\u003ein general feel muted or dulled."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#0072B2","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Mood, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"1D2zUILC8T+wv3bw\u002fZnuPyzGeMM+4Ok\u002fhDOtUhwr6D\u002fMdZiJXH\u002fnP9gQ65OwKvE\u002fUnwUGTmL5z8Umg717ULmP75jY3I1\u002f+w\u002f3PlPSLGD3z8w\u002fEUlqBjuP+CJ3bQPQPE\u002f+MZysVHW0j8WeSdvV6HiP9L5Ap\u002fpjOk\u002faHAcsGrUzT+vazEROP3yP5PFkZxw1PM\u002fDaELA4xp9D8="},"y":{"dtype":"f8","bdata":"IFPUJUs0or\u002fAK0f4m1e0PyBS6YhT58G\u002fIN3GkbsW0T+Y9yUTRJnVP2DQXmFCfKo\u002fvKC2BAxT1D+g7KZFPnrIP1AdtrNq0Lk\u002fMj1zhDiG4D9g2G5SCYy+P+ToN1xekdK\u002fxEhYyaB+0j9QkrZA2krLP\u002fDgRB6xCMO\u002f\u002fnuwN5af4T80unHTmo\u002fTv9BOI3XWaLu\u002f+HixPtCHxL8="},"z":{"dtype":"f8","bdata":"AAEaTAdBoT9AYCnm71O4P4grulWxmdQ\u002fAFAmcduQZD+AaTxvK5qYP0Adt\u002fMfZbK\u002fQF6nRR8GsL9gLsdWKwi2PwAnCIGzl6A\u002fgNWlbU4fp7\u002fANcbU7teovxB1oJTfIdI\u002fMJBA8hcZ1T849z2MM+bSP3gVOX4KFtI\u002fcMxdecfwwD8AABJSf3JNP1Ai3fFYzsO\u002f8Cxr3D8pwL8="},"type":"scatter3d"},{"customdata":[["dsm-5,somatic","They experience noticeable changes in weight\u2014either losing or\u003cbr\u003egaining\u2014without intentionally trying to diet, along with shifts in\u003cbr\u003etheir appetite. Their sleep is disrupted, with difficulty falling or\u003cbr\u003estaying asleep, or alternatively, sleeping far more than usual. Others\u003cbr\u003ecan observe changes in their physical movements and behavior: they may\u003cbr\u003eappear restless and agitated, or conversely, slowed down in their\u003cbr\u003espeech and actions. They feel persistently tired and lack the energy\u003cbr\u003ethey once had."],["ham-d-1,somatic","Initial Insomnia: The person has difficulty falling asleep at the\u003cbr\u003ebeginning of the night."],["ham-d-10,somatic","Hypochondriasis: The person shows excessive focus on their body and\u003cbr\u003ehealth, ranging from bodily self-absorption to preoccupation with\u003cbr\u003ehealth concerns, a tendency to complain about physical ailments, or\u003cbr\u003efixed false beliefs about having a serious illness."],["ham-d-11,somatic","Weight Loss: The person has experienced a noticeable decrease in body\u003cbr\u003eweight."],["ham-d-2,somatic","Middle Insomnia: The person feels restless and disturbed during the\u003cbr\u003enight, often waking up during sleeping hours."],["ham-d-3,somatic","Delayed Insomnia: The person wakes up in the early hours of the\u003cbr\u003emorning and is unable to fall asleep again."],["ham-d-4,somatic","Retardation: The person experiences slowness in their thought\u003cbr\u003eprocesses, speech, and physical activity. They may appear apathetic\u003cbr\u003eor, in more pronounced cases, enter a state of stupor."],["ham-d-5,somatic","Agitation: The person displays restlessness that is associated with\u003cbr\u003efeelings of anxiety."],["ham-d-6,somatic","Somatic Anxiety: The person experiences physical symptoms related to\u003cbr\u003eanxiety, which may include gastrointestinal issues such as\u003cbr\u003eindigestion, cardiovascular symptoms like palpitations, headaches,\u003cbr\u003erespiratory difficulties, or genito-urinary complaints."],["ham-d-7,somatic","Gastrointestinal Somatic Symptoms: The person experiences a loss of\u003cbr\u003eappetite, a heavy feeling in the abdomen, or constipation."],["ham-d-8,somatic","General Somatic Symptoms: The person feels heaviness in their limbs,\u003cbr\u003eback, or head, and may experience diffuse backaches, a loss of energy,\u003cbr\u003eor easy fatiguability."],["ham-d-9,somatic","Genital Symptoms: The person experiences a loss of libido or, in the\u003cbr\u003ecase of women, menstrual disturbances."],["icd-10,somatic","They experience changes in their appetite\u2014either eating much less or\u003cbr\u003emuch more than usual\u2014which leads to noticeable weight loss or gain.\u003cbr\u003eTheir sleep is disrupted; they may struggle to fall or stay asleep, or\u003cbr\u003econversely find themselves sleeping far more than normal. Even minimal\u003cbr\u003eeffort leaves them feeling tired and drained, as though their energy\u003cbr\u003ehas been depleted. Their physical movements and behavior have also\u003cbr\u003echanged\u2014they may appear restless and agitated, or alternatively seem\u003cbr\u003eslowed down in their speech and actions."],["madrs-1,somatic","Reduced sleep: They experience a reduction in the duration or depth of\u003cbr\u003etheir sleep compared to their usual pattern when feeling well. This\u003cbr\u003emay manifest as difficulty falling asleep, lighter or more fitful\u003cbr\u003esleep, sleep that is broken or shortened by several hours, or sleeping\u003cbr\u003eonly a few hours per night."],["madrs-2,somatic","Reduced appetite: They experience a diminished appetite compared to\u003cbr\u003ewhen they are well. This presents as a decreased desire for food or a\u003cbr\u003eneed to force themselves to eat. Food may seem tasteless, and they may\u003cbr\u003erequire encouragement or persuasion from others to eat at all."],["madrs-3,somatic","Lassitude: They have difficulty getting started with activities and\u003cbr\u003eexperience slowness in initiating and performing everyday tasks.\u003cbr\u003eRoutine activities require considerable effort to begin and carry out,\u003cbr\u003eand in more pronounced cases, they may feel unable to do anything\u003cbr\u003ewithout assistance from others."],["phq-9-1,somatic","They have trouble falling asleep, staying asleep, or sleep too much."],["phq-9-2,somatic","They feel tired or have little energy."],["phq-9-3,somatic","They have a poor appetite or overeat."],["phq-9-4,somatic","They move or speak so slowly that other people could have noticed, or\u003cbr\u003ethe opposite\u2014they are so fidgety or restless that they have been\u003cbr\u003emoving around a lot more than usual."],["proceed-1,somatic","Physical symptoms: They experience pain or other physical symptoms.\u003cbr\u003eTheir appetite or weight has changed. They have difficulty with sexual\u003cbr\u003efunction."],["proceed-2,somatic","Sleep: They sleep excessively. Their sleep is disturbed or restless.\u003cbr\u003eThey have difficulty falling or staying asleep."],["proceed-3,somatic","Psychomotor and expression: They cry. They speak very little or not at\u003cbr\u003eall. Their facial expressions appear flat or diminished. Their\u003cbr\u003emovements and reactions are slowed."],["proceed-4,somatic","Energy: They feel that everything requires effort. They feel\u003cbr\u003ephysically weak. They have low energy. They feel fatigued or tired."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#009E73","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Somatic, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"SLbTbWJBwD80Opcq4Tbdv\u002fy03rYvF9Q\u002fln52PkSs5L\u002fgPuOsJMjUv1xC9+Z7r9y\u002f4MtI9p\u002f+qz9AQUEWXWe7vzD5DoWNvLi\u002fZME4H0cr17\u002fAPe9R1ZeXP9RpfXZ\u002fkdm\u002fgCcT\u002fCO3yT9g81Mk\u002fT29v2BXIQrWmMI\u002fGPna0lnQ2T9IJq104X7Wv4DbWXS4pIS\u002fR uicidality","They experience suicidal thoughts and may have made preparations for\u003cbr\u003esuicide. In some cases, they may have explicit plans for suicide or\u003cbr\u003emay be actively preparing for it."],["phq-9,suicidality","They have thoughts that they would be better off dead or of hurting\u003cbr\u003ethemselves in some way."],["proceed,suicidality","Autoaggression symptoms: The individual experiences thoughts related\u003cbr\u003eto their desire to continue living. They report suicidal ideation and\u003cbr\u003eengage in self-harming behaviors. They have attempted suicide."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#D55E00","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Suicidality, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"AGgSoK5kcb8gBI1gNd6zP1BneNufydG\u002fSLL0brVWxz\u002fAAbYUI6CsvwANMvU3gKy\u002fKH5aJUG2x78AM0ec\u002fNSRPw=="},"y":{"dtype":"f8","bdata":"MDSzYwCLsb+A3lx8qEqvv2CumO\u002fgt8I\u002fAA1IeeEzvb8AxiBWk1hov9BaFf2gRLC\u002fcGvOUjgvtz8ofn44acHMPw=="},"z":{"dtype":"f8","bdata":"Vk5g2DFn8T8+QUCyYnPwP3628bCY\u002fPU\u002fGPyvIwx26z+sL3rlo1bsP5QxjysxxfE\u002flL2pZIrg7T+AJEpc\u002fC7tPw=="},"type":"scatter3d"},{"customdata":[["dv-1-1,mood","(text withheld: not redistributable)"],["dv-1-10,mood","(text withheld: not redistributable)"],["dv-1-2,mood","(text withheld: not redistributable)"],["dv-1-3,mood","(text withheld: not redistributable)"],["dv-1-4,mood","(text withheld: not redistributable)"],["dv-1-5,mood","(text withheld: not redistributable)"],["dv-1-6,mood","(text withheld: not redistributable)"],["dv-1-7,mood","(text withheld: not redistributable)"],["dv-1-8,mood","(text withheld: not redistributable)"],["dv-1-9,mood","(text withheld: not redistributable)"],["dv-2-1,mood","(text withheld: not redist  feeling sad, empty, or\u003cbr\u003ehopeless, and may appear tearful to others. They have lost interest or\u003cbr\u003epleasure in activities they used to enjoy. They struggle with feelings\u003cbr\u003eof worthlessness or carry excessive or inappropriate guilt that goes\u003cbr\u003ebeyond normal self-criticism. They also have difficulty thinking\u003cbr\u003eclearly, concentrating, or making decisions."],["ham-d-1,mood","Depressed Mood: They have a gloomy attitude and feel pessimistic about\u003cbr\u003ethe future. They experience persistent feelings of sadness and may\u003cbr\u003ehave a tendency to weep."],["ham-d-2,mood","Feelings of Guilt: They engage in self-reproach and feel they have let\u003cbr\u003epeople down. They experience ideas of guilt, and may believe their\u003cbr\u003epresent illness is a punishment. In some cases, they may have\u003cbr\u003edelusions or hallucinations related to guilt."],["ham-d-3,mood","Work and Interests: They experience feelings of incapacity,\u003cbr\u003elistlessness, indecision, and vacillation. They have lost interest in\u003cbr\u003ehobbies and show decreased social activities. Their productivity has\u003cbr\u003edecreased, and they may be unable to work due to their present\u003cbr\u003eillness."],["ham-d-4,mood","Anxiety (Psychic): They experience tension and irritability. They\u003cbr\u003eworry about minor matters and have an apprehensive attitude. They may\u003cbr\u003eexperience fears."],["icd-10,mood","They experience a persistently low mood throughout the day, which\u003cbr\u003eothers may also observe. They have lost interest or pleasure in\u003cbr\u003eactivities they would normally enjoy. They struggle with feelings of\u003cbr\u003eworthlessness and carry excessive or inappropriate guilt. Their\u003cbr\u003eability to think clearly or concentrate is diminished, and they often\u003cbr\u003efeel indecisive. Their self-confidence and self-esteem are reduced."],["madrs-1,mood","Apparent Sadness: They appear despondent, gloomy, or in despair\u2014beyond\u003cbr\u003eordinary low spirits. This is reflected in their speech, facial\u003cbr\u003eexpression, and posture. They may look dispirited or unhappy, and at\u003cbr\u003etimes struggle to brighten up even when circumstances might warrant\u003cbr\u003eit."],["madrs-2,mood","Reported Sadness: They describe feeling depressed, low in spirits, or\u003cbr\u003edespondent, regardless of whether this is visible in their appearance.\u003cbr\u003eThey may report feeling beyond help or without hope. Their mood may be\u003cbr\u003einfluenced by external circumstances to varying degrees, or it may\u003cbr\u003efeel continuous and unvarying."],["madrs-3,mood","Inner Tension: They experience feelings of ill-defined discomfort,\u003cbr\u003eedginess, or inner turmoil. This mental tension can escalate to\u003cbr\u003efeelings of panic, dread, or anguish. They may seek reassurance and\u003cbr\u003efind it difficult to master these feelings on their own."],["madrs-4,mood","Concentration Difficulties: They have difficulty collecting their\u003cbr\u003ethoughts or sustaining concentration. This may interfere with their\u003cbr\u003eability to read, hold a conversation, or complete tasks that require\u003cbr\u003efocused attention."],["madrs-5,mood","Inability to Feel: They experience reduced interest in their\u003cbr\u003esurroundings or in activities that would normally bring them pleasure.\u003cbr\u003eTheir ability to react with appropriate emotion to circumstances or\u003cbr\u003epeople feels diminished. They may feel emotionally numb or\u003cbr\u003edisconnected from friends and loved ones, struggling to feel anger,\u003cbr\u003egrief, or joy."],["madrs-6,mood","Pessimistic Thoughts: They experience thoughts of guilt, inferiority,\u003cbr\u003eself-reproach, or remorse. They may engage in self-accusations or feel\u003cbr\u003eincreasingly pessimistic about the future, dwelling on ideas of\u003cbr\u003efailure, sin, or ruin."],["phq-9-1,mood","They have little interest or pleasure in doing things."],["phq-9-2,mood","They feel down, depressed, or hopeless."],["phq-9-3,mood","They feel bad about themselves, or feel like a failure, or feel they\u003cbr\u003ehave let themselves or their family down."],["phq-9-4,mood","They have trouble concentrating on things, such as reading the\u003cbr\u003enewspaper or watching television."],["proceed-1,mood","Perception of Self: This person often feels that others are against\u003cbr\u003ethem or out to get them. They experience a profound sense of\u003cbr\u003eisolation, as though they are fundamentally alone in the world. They\u003cbr\u003ecarry a belief that they are a burden to those around them and feel\u003cbr\u003ethat others do not truly understand them. They struggle with\u003cbr\u003econfidence in their own abilities and hold a diminished view of their\u003cbr\u003eown worth. At times, they feel disconnected from themselves or their\u003cbr\u003esurroundings, and they may have difficulty recognizing\u003cbr\u003ethemselves\u2014whether in the mirror or in terms of who they feel they are\u003cbr\u003eas a person."],["proceed-2,mood","Cognitive Symptoms: This person finds it difficult to feel motivated\u003cbr\u003eor to maintain interest in activities. They believe their condition is\u003cbr\u003euntreatable and hold a generally pessimistic view of situations. Their\u003cbr\u003ethinking tends to be distorted, often interpreting events in\u003cbr\u003enegatively skewed ways. They struggle to make decisions and have\u003cbr\u003edifficulty with planning, organizing, and following through on tasks.\u003cbr\u003eAdapting to new information or shifting between tasks is challenging\u003cbr\u003efor them. They find it hard to solve problems effectively and\u003cbr\u003eexperience lapses in memory. Maintaining focus and concentration is\u003cbr\u003edifficult, as is managing their time. Their perception of time may\u003cbr\u003efeel altered\u2014either dragging or slipping away. They have trouble\u003cbr\u003eenvisioning a positive future and tend to dwell on negative thoughts\u003cbr\u003erepeatedly. Their thinking often feels foggy or unclear. They may have\u003cbr\u003ereduced capacity to understand or share in others' feelings and show\u003cbr\u003ediminished interest in social connection."],["proceed-3,mood","Mood and Emotional Symptoms: This person experiences significant\u003cbr\u003epsychological pain and a pervasive sense that things will not improve.\u003cbr\u003eThey feel powerless to change their circumstances and see themselves\u003cbr\u003eas having little value. A general sense of feeling bad pervades their\u003cbr\u003eexperience, often accompanied by guilt. Sadness is a frequent\u003cbr\u003ecompanion, along with feelings of anxiety and a fear of failing at\u003cbr\u003ethings they attempt. They often feel restless and on edge, becoming\u003cbr\u003eeasily irritated and frustrated. They have difficulty managing their\u003cbr\u003eemotions and controlling their impulses. Their mood may not shift\u003cbr\u003eappropriately in response to positive events. They have lost their\u003cbr\u003esense of humor and find little or no pleasure in activities they once\u003cbr\u003eenjoyed. They often feel empty inside, and their emotional responses\u003cbr\u003ein general feel muted or dulled."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#0072B2","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Mood, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"UtUOFsS48T9wYFzcN+LuPyQuWFNtj+k\u002fvmanwB5\u002f6D\u002f4EvNQDrnnP2D0S+mUIvE\u002fKqaeQ8sn6D+AYZt2zsvmPy7bacSfxOw\u002fFKnkNHUY4D9CvzqPJ+btP4jQqwCHFPE\u002f1CMPVjTV0z84J\u002fKLBUHhP+LZ\u002fno7iuk\u002fiH\u002f\u002fUoXbzz9QLoVyyODyPz2z8WKW2vM\u002 hours of the\u003cbr\u003emorning and is unable to fall asleep again."],["ham-d-4,somatic","Retardation: The person experiences slowness in their thought\u003cbr\u003eprocesses, speech, and physical activity. They may appear apathetic\u003cbr\u003eor, in more pronounced cases, enter a state of stupor."],["ham-d-5,somatic","Agitation: The person displays restlessness that is associated with\u003cbr\u003efeelings of anxiety."],["ham-d-6,somatic","Somatic Anxiety: The person experiences physical symptoms related to\u003cbr\u003eanxiety, which may include gastrointestinal issues such as\u003cbr\u003eindigestion, cardiovascular symptoms like palpitations, headaches,\u003cbr\u003erespiratory difficulties, or genito-urinary complaints."],["ham-d-7,somatic","Gastrointestinal Somatic Symptoms: The person experiences a loss of\u003cbr\u003eappetite, a heavy feeling in the abdomen, or constipation."],["ham-d-8,somatic","General Somatic Symptoms: The person feels heaviness in their limbs,\u003cbr\u003eback, or head, and may experience diffuse backaches, a loss of energy,\u003cbr\u003eor easy fatiguability."],["ham-d-9,somatic","Genital Symptoms: The person experiences a loss of libido or, in the\u003cbr\u003ecase of women, menstrual disturbances."],["icd-10,somatic","They experience changes in their appetite\u2014either eating much less or\u003cbr\u003emuch more than usual\u2014which leads to noticeable weight loss or gain.\u003cbr\u003eTheir sleep is disrupted; they may struggle to fall or stay asleep, or\u003cbr\u003econversely find themselves sleeping far more than normal. Even minimal\u003cbr\u003eeffort leaves them feeling tired and drained, as though their energy\u003cbr\u003ehas been depleted. Their physical movements and behavior have also\u003cbr\u003echanged\u2014they may appear restless and agitated, or alternatively seem\u003cbr\u003eslowed down in their speech and actions."],["madrs-1,somatic","Reduced sleep: They experience a reduction in the duration or depth of\u003cbr\u003etheir sleep compared to their usual pattern when feeling well. This\u003cbr\u003emay manifest as difficulty falling asleep, lighter or more fitful\u003cbr\u003esleep, sleep that is broken or shortened by several hours, or sleeping\u003cbr\u003eonly a few hours per night."],["madrs-2,somatic","Reduced appetite: They experience a diminished appetite compared to\u003cbr\u003ewhen they are well. This presents as a decreased desire for food or a\u003cbr\u003eneed to force themselves to eat. Food may seem tasteless, and they may\u003cbr\u003erequire encouragement or persuasion from others to eat at all."],["madrs-3,somatic","Lassitude: They have difficulty getting started with activities and\u003cbr\u003eexperience slowness in initiating and performing everyday tasks.\u003cbr\u003eRoutine activities require considerable effort to begin and carry out,\u003cbr\u003eand in more pronounced cases, they may feel unable to do anything\u003cbr\u003ewithout assistance from others."],["phq-9-1,somatic","They have trouble falling asleep, staying asleep, or sleep too much."],["phq-9-2,somatic","They feel tired or have little energy."],["phq-9-3,somatic","They have a poor appetite or overeat."],["phq-9-4,somatic","They move or speak so slowly that other people could have noticed, or\u003cbr\u003ethe opposite\u2014they are so fidgety or restless that they have been\u003cbr\u003emoving around a lot more than usual."],["proceed-1,somatic","Physical symptoms: They experience pain or other physical symptoms.\u003cbr\u003eTheir appetite or weight has changed. They have difficulty with sexual\u003cbr\u003efunction."],["proceed-2,somatic","Sleep: They sleep excessively. Their sleep is disturbed or restless.\u003cbr\u003eThey have difficulty falling or staying asleep."],["proceed-3,somatic","Psychomotor and expression: They cry. They speak very little or not at\u003cbr\u003eall. Their facial expressions appear flat or diminished. Their\u003cbr\u003emovements and reactions are slowed."],["proceed-4,somatic","Energy: They feel that everything requires effort. They feel\u003cbr\u003ephysically weak. They have low energy. They feel fatigued or tired."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#009E73","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Somatic, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"ELbLvlzFvD\u002fcPwduXwjdv3z\u002fVhsW49Q\u002fOHrjNNtI5L9YQlcOnfnUv0z4JGqEtNy\u002fYGktZjmYrT\u002fQPGA9Pwe3vyD5YM5c8be\u002fFDiYl\u002fjT1r8AsNZ4DRydP+BAJN7BCdm\u002fAHxvO6gxyD9w54MYHi\u002fAv1CIscQcysE\u002fQNz9E3rD2j\u002fskF9QDHnWvwBgAAGwlEW\u002fWBVJTkZJ078QICgxBVm4v4CFWU7+EKe\u002frN8wmhc41b8Amxnn0bR+v7gkwtyGRtI\u002f"},"y":{"dtype":"f8","bdata":"CRUFnbgK8D9cU9lOBlj1PyQZzUsqneE\u002fDhr3lCQm9j\u002fS4Pfr50L1P3Wkr3uVZfU\u002fxBa6zopq7j9Qf5xgtZzwP28PHOKN0fE\u002fga0QsFw09T+H944byyvyP4rCBu19WvM\u002fgGfUvhkE7z+P1KRnEhfyPygUFHqwAug\u002fEt59fCVG4z\u002f0svx2a4v0P0IFXhSFDu4\u002fJKxFJNNx7z+UVhECQCHqP9pr+5QMqvI\u002fjLkVGXVl9z\u002fgfy5DKu7vP0jddsXRTOc\u002f"},"z":{"dtype":"f8","bdata":"sFVbw+85wb8AygUBPjG7P4D0hBp0iMc\u002fQNZ4IZtI0D+AJiXiDt6sP4CeckNNZrM\u002fgMBH2yyimz+AhLLD7YrEP+AZ+61DabQ\u002fAFknaGgGoz9gKNo0n5Kwv\u002fCmBOyhKMY\u002f0Ko4tAZlxb8AfVhGkJerv0DjF56+OqI\u002fANiwEe0Hq79giporEee1P8AEvTsg7sI\u002fSP+2lB\u002fe0D8gEp93Wu66PwA+uxxnO3u\u002fAFNwcAgJr7+Aa5GsWW+Vv4D7j1XPo6K\u002f"},"type":"scatter3d"},{"customdata":[["dsm-5,suicidality","The person frequently thinks about death, beyond simply fearing dying.\u003cbr\u003eThey may have recurring thoughts of suicide without a specific plan,\u003cbr\u003eor they may have attempted suicide or developed a specific plan for\u003cbr\u003ecommitting suicide."],["ham-d,suicidality","The person may experience thoughts related to not wanting to live.\u003cbr\u003eThis can include feeling that life is not worth living, wishing they\u003cbr\u003ewere dead, having suicidal ideas or making suicidal gestures, or\u003cbr\u003eattempting suicide."],["icd-10,suicidality","They experience recurring thoughts about death or have engaged in\u003cbr\u003esuicidal behavior."],["madrs-1,suicidality","This person has expressed feelings that life is not worth living and\u003cbr\u003ehas indicated that a natural death would be welcome. They may feel\u003cbr\u003eweary of life, with fleeting or recurring thoughts of suicide."],["madrs-2,suicidality","At times, they may believe they would be better off dead, viewing\u003cbr\u003esuicide as a possible solution, though not necessarily with specific\u003cbr\u003eplans or intention."],["madrs-3,suicidality","They experience suicidal thoughts and may have made preparations for\u003cbr\u003esuicide. In some cases, they may have explicit plans for suicide or\u003cbr\u003emay be actively preparing for it."],["phq-9,suicidality","They have thoughts that they would be better off dead or of hurting\u003cbr\u003ethemselves in some way."],["proceed,suicidality","Autoaggression symptoms: The individual experiences thoughts related\u003cbr\u003eto their desire to continue living. They report suicidal ideation and\u003cbr\u003eengage in self-harming behaviors. They have attempted suicide."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#D55E00","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Suicidality, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"AHQL3MJJgb8gvx6A\u002fiGxP9hfmLDCbtG\u002fGKAqFKvpyD9AFwBqnQipvyD6KGFdFbG\u002fyJwMcD+Dxr8A6HVXENqSPw=="},"y":{"dtype":"f8","bdata":"4HF3eRqSrr+Aemew1Gitv8AMG8cHPcM\u002fKHZl2ApMwL8Ad837abZ3v+BFXzgVyaq\u002fIEndqQF7tT\u002f48doT4AXMPw=="},
