6D8AaDqDtL3pPwBIeD3NhOs\u002fAAj\u002fhwgF6j8AsMNEagjrPwDMHuF3wfE\u002f"},"type":"scatter3d"},{"customdata":[["dsm-5,mood","This person experiences a depressed mood, feeling sad, empty, or\u003cbr\u003ehopeless, and may appear tearful to others. They have lost interest or\u003cbr\u003epleasure in activities they used to enjoy. They struggle with feelings\u003cbr\u003eof worthlessness or carry excessive or inappropriate guilt that goes\u003cbr\u003ebeyond normal self-criticism. They also have difficulty thinking\u003cbr\u003eclearly, concentrating, or making decisions."],["ham-d-1,mood","Depressed Mood: They have a gloomy attitude and feel pessimistic about\u003cbr\u003ethe future. They experience persistent feelings of sadness and may\u003cbr\u003ehave a tendency to weep."],["ham-d-2,mood","Feelings of Guilt: They engage in self-reproach and feel they have let\u003cbr\u003epeople down. They experience ideas of guilt, and may believe their\u003cbr\u003epresent illness is a punishment. In some cases, they may have\u003cbr\u003edelusions or hallucinations related to guilt."],["ham-d-3,mood","Work and Interests: They experience feelings of incapacity,\u003cbr\u003elistlessness, indecision, and vacillation. They have lost interest in\u003cbr\u003ehobbies and show decreased social activities. Their productivity has\u003cbr\u003edecreased, and they may be unable to work due to their present\u003cbr\u003eillness."],["ham-d-4,mood","Anxiety (Psychic): They experience tension and irritability. They\u003cbr\u003eworry about minor matters and have an apprehensive attitude. They may\u003cbr\u003eexperience fears."],["icd-10,mood","They experience a persistently low mood throughout the day, which\u003cbr\u003eothers may also observe. They have lost interest or pleasure in\u003cbr\u003eactivities they would normally enjoy. They struggle with feelings of\u003cbr\u003eworthlessness and carry excessive or inappropriate guilt. Their\u003cbr\u003eability to think clearly or concentrate is diminished, and they often\u003cbr\u003efeel indecisive. Their self-confidence and self-esteem are reduced."],["madrs-1,mood","Apparent Sadness: They appear despondent, gloomy, or in despair\u2014beyond\u003cbr\u003eordinary low spirits. This is reflected in their speech, facial\u003cbr\u003eexpression, and posture. They may look dispirited or unhappy, and at\u003cbr\u003etimes struggle to brighten up even when circumstances might warrant\u003cbr\u003eit."],["madrs-2,mood","Reported Sadness: They describe feeling depressed, low in spirits, or\u003cbr\u003edespondent, regardless of whether this is visible in their appearance.\u003cbr\u003eThey may report feeling beyond help or without hope. Their mood may be\u003cbr\u003einfluenced by external circumstances to varying degrees, or it may\u003cbr\u003efeel continuous and unvarying."],["madrs-3,mood","Inner Tension: They experience feelings of ill-defined discomfort,\u003cbr\u003eedginess, or inner turmoil. This mental tension can escalate to\u003cbr\u003efeelings of panic, dread, or anguish. They may seek reassurance and\u003cbr\u003efind it difficult to master these feelings on their own."],["madrs-4,mood","Concentration Difficulties: They have difficulty collecting their\u003cbr\u003ethoughts or sustaining concentration. This may interfere with their\u003cbr\u003eability to read, hold a conversation, or complete tasks that require\u003cbr\u003efocused attention."],["madrs-5,mood","Inability to Feel: They experience reduced interest in their\u003cbr\u003esurroundings or in activities that would normally bring them pleasure.\u003cbr\u003eTheir ability to react with appropriate emotion to circumstances or\u003cbr\u003epeople feels diminished. They may feel emotionally numb or\u003cbr\u003edisconnected from friends and loved ones, struggling to feel anger,\u003cbr\u003egrief, or joy."],["madrs-6,mood","Pessimistic Thoughts: They experience thoughts of guilt, inferiority,\u003cbr\u003eself-reproach, or remorse. They may engage in self-accusations or feel\u003cbr\u003eincreasingly pessimistic about the future, dwelling on ideas of\u003cbr\u003efailure, sin, or ruin."],["phq-9-1,mood","They have little interest or pleasure in doing things."],["phq-9-2,mood","They feel down, depressed, or hopeless."],["phq-9-3,mood","They feel bad about themselves, or feel like a failure, or feel they\u003cbr\u003ehave let themselves or their family down."],["phq-9-4,mood","They have trouble concentrating on things, such as reading the\u003cbr\u003enewspaper or watching television."],["proceed-1,mood","Perception of Self: This person often feels that others are against\u003cbr\u003ethem or out to get them. They experience a profound sense of\u003cbr\u003eisolation, as though they are fundamentally alone in the world. They\u003cbr\u003ecarry a belief that they are a burden to those around them and feel\u003cbr\u003ethat others do not truly understand them. They struggle with\u003cbr\u003econfidence in their own abilities and hold a diminished view of their\u003cbr\u003eown worth. At times, they feel disconnected from themselves or their\u003cbr\u003esurroundings, and they may have difficulty recognizing\u003cbr\u003ethemselves\u2014whether in the mirror or in terms of who they feel they are\u003cbr\u003eas a person."],["proceed-2,mood","Cognitive Symptoms: This person finds it difficult to feel motivated\u003cbr\u003eor to maintain interest in activities. They believe their condition is\u003cbr\u003euntreatable and hold a generally pessimistic view of situations. Their\u003cbr\u003ethinking tends to be distorted, often interpreting events in\u003cbr\u003enegatively skewed ways. They struggle to make decisions and have\u003cbr\u003edifficulty with planning, organizing, and following through on tasks.\u003cbr\u003eAdapting to new information or shifting between tasks is challenging\u003cbr\u003efor them. They find it hard to solve problems effectively and\u003cbr\u003eexperience lapses in memory. Maintaining focus and concentration is\u003cbr\u003edifficult, as is managing their time. Their perception of time may\u003cbr\u003efeel altered\u2014either dragging or slipping away. They have trouble\u003cbr\u003eenvisioning a positive future and tend to dwell on negative thoughts\u003cbr\u003erepeatedly. Their thinking often feels foggy or unclear. They may have\u003cbr\u003ereduced capacity to understand or share in others' feelings and show\u003cbr\u003ediminished interest in social connection."],["proceed-3,mood","Mood and Emotional Symptoms: This person experiences significant\u003cbr\u003epsychological pain and a pervasive sense that things will not improve.\u003cbr\u003eThey feel powerless to change their circumstances and see themselves\u003cbr\u003eas having little value. A general sense of feeling bad pervades their\u003cbr\u003eexperience, often accompanied by guilt. Sadness is a frequent\u003cbr\u003ecompanion, along with feelings of anxiety and a fear of failing at\u003cbr\u003ethings they attempt. They often feel restless and on edge, becoming\u003cbr\u003eeasily irritated and frustrated. They have difficulty managing their\u003cbr\u003eemotions and controlling their impulses. Their mood may not shift\u003cbr\u003eappropriately in response to positive events. They have lost their\u003cbr\u003esense of humor and find little or no pleasure in activities they once\u003cbr\u003eenjoyed. They often feel empty inside, and their emotional responses\u003cbr\u003ein general feel muted or dulled."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#0072B2","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Mood, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"AM55xoET8T8AYla\u002fXETwPwD4jmE4yuY\u002fACRlGgHA5j8AhPmjB9viPwDakUGxy\u002fA\u002fADgT570I5T8AjC31FLfnPwBAjvcsPeU\u002fAKSTOMmE5T8AnAn57x7vPwC4eXdS1PA\u002fAKAgUC2V2D8AKKPImUTWPwDAcx+mduc\u002fAGBzP87\u002fzz8AIF4beub0PwAAWDJ3KPQ\u002fAMTwiifv9D8="},"y":{"dtype":"f8","bdata":"AOBAeOcytb8AQGJ4T7WUvwCgV7ZX0rW\u002fAKDytHL80z8AyM9sM57XPwCA3vyss4C\u002fAIAZj8cu0z8A0HHp3vq5PwBQSZ7WhNA\u002fAIT496Bm3z8AkAFLhg26PwAkI9HKItS\u002fAKhJFe8J1j8AGL8seoLUPwCw2LoRPLW\u002fAG5eXehM5z8AtOSS7D\u002fTvwBgrpUiUrK\u002fAKBGPcItyL8="},"z":{"dtype":"f8","bdata":"AKCnRQUrsb8AQHn2T+mhvwBoF3STi9Y\u002fAIAJ9Q\u002fZor8AgAw25gWRPwAA4wgbXrm\u002fAABcgoXSrD8AgGza7JTBPwDAfPN1MbA\u002fAICzLWQdxL8AAMZJbQqyvwAwNnmJM8k\u002fAOCOjg4Ryj8AqHQiu47RPwDAhfj8Bdg\u002fAABBlyijnz8AgOcSjtOsPwDAjNL\u002fKcW\u002fAICB1ZZrsr8="},"type":"scatter3d"},{"customdata":[["dsm-5,somatic","They experience noticeable changes in weight\u2014either losing or\u003cbr\u003egaining\u2014without intentionally trying to diet, along with shifts in\u003cbr\u003etheir appetite. Their sleep is disrupted, with difficulty falling or\u003cbr\u003estaying asleep, or alternatively, sleeping far more than usual. Others\u003cbr\u003ecan observe changes in their physical movements and behavior: they may\u003cbr\u003eappear restless and agitated, or conversely, slowed down in their\u003cbr\u003espeech and actions. They feel persistently tired and lack the energy\u003cbr\u003ethey once had."],["ham-d-1,somatic","Initial Insomnia: The person has difficulty falling asleep at the\u003cbr\u003ebeginning of the night."],["ham-d-10,somatic","Hypochondriasis: The person shows excessive focus on their body and\u003cbr\u003ehealth, ranging from bodily self-absorption to preoccupation with\u003cbr\u003ehealth concerns, a tendency to complain about physical ailments, or\u003cbr\u003efixed false beliefs about having a serious illness."],["ham-d-11,somatic","Weight Loss: The person has experienced a noticeable decrease in body\u003cbr\u003eweight."],["ham-d-2,somatic","Middle Insomnia: The person feels restless and disturbed during the\u003cbr\u003enight, often waking up during sleeping hours."],["ham-d-3,somatic","Delayed Insomnia: The person wakes up in the early hours of the\u003cbr\u003emorning and is unable to fall asleep again."],["ham-d-4,somatic","Retardation: The person experiences slowness in their thought\u003cbr\u003eprocesses, speech, and physical activity. They may appear apathetic\u003cbr\u003eor, in more pronounced cases, enter a state of stupor."],["ham-d-5,somatic","Agitation: The person displays restlessness that is associated with\u003cbr\u003efeelings of anxiety."],["ham-d-6,somatic","Somatic Anxiety: The person experiences physical symptoms related to\u003cbr\u003eanxiety, which may include gastrointestinal issues such as\u003cbr\u003eindigestion, cardiovascular symptoms like palpitations, headaches,\u003cbr\u003erespiratory difficulties, or genito-urinary complaints."],["ham-d-7,somatic","Gastrointestinal Somatic Symptoms: The person experiences a loss of\u003cbr\u003eappetite, a heavy feeling in the abdomen, or constipation."],["ham-d-8,somatic","General Somatic Symptoms: The person feels heaviness in their limbs,\u003cbr\u003eback, or head, and may experience diffuse backaches, a loss of energy,\u003cbr\u003eor easy fatiguability."],["ham-d-9,somatic","Genital Symptoms: The person experiences a loss of libido or, in the\u003cbr\u003ecase of women, menstrual disturbances."],["icd-10,somatic","They experience changes in their appetite\u2014either eating much less or\u003cbr\u003emuch more than usual\u2014which leads to noticeable weight loss or gain.\u003cbr\u003eTheir sleep is disrupted; they may struggle to fall or stay asleep, or\u003cbr\u003econversely find themselves sleeping far more than normal. Even minimal\u003cbr\u003eeffort leaves them feeling tired and drained, as though their energy\u003cbr\u003ehas been depleted. Their physical movements and behavior have also\u003cbr\u003echanged\u2014they may appear restless and agitated, or alternatively seem\u003cbr\u003eslowed down in their speech and actions."],["madrs-1,somatic","Reduced sleep: They experience a reduction in the duration or depth of\u003cbr\u003etheir sleep compared to their usual pattern when feeling well. This\u003cbr\u003emay manifest as difficulty falling asleep, lighter or more fitful\u003cbr\u003esleep, sleep that is broken or shortened by several hours, or sleeping\u003cbr\u003eonly a few hours per night."],["madrs-2,somatic","Reduced appetite: They experience a diminished appetite compared to\u003cbr\u003ewhen they are well. This presents as a decreased desire for food or a\u003cbr\u003eneed to force themselves to eat. Food may seem tasteless, and they may\u003cbr\u003erequire encouragement or persuasion from others to eat at all."],["madrs-3,somatic","Lassitude: They have difficulty getting started with activities and\u003cbr\u003eexperience slowness in initiating and performing everyday tasks.\u003cbr\u003eRoutine activities require considerable effort to begin and carry out,\u003cbr\u003eand in more pronounced cases, they may feel unable to do anything\u003cbr\u003ewithout assistance from others."],["phq-9-1,somatic","They have trouble falling asleep, staying asleep, or sleep too much."],["phq-9-2,somatic","They feel tired or have little energy."],["phq-9-3,somatic","They have a poor appetite or overeat."],["phq-9-4,somatic","They move or speak so slowly that other people could have noticed, or\u003cbr\u003ethe opposite\u2014they are so fidgety or restless that they have been\u003cbr\u003emoving around a lot more than usual."],["proceed-1,somatic","Physical symptoms: They experience pain or other physical symptoms.\u003cbr\u003eTheir appetite or weight has changed. They have difficulty with sexual\u003cbr\u003efunction."],["proceed-2,somatic","Sleep: They sleep excessively. Their sleep is disturbed or restless.\u003cbr\u003eThey have difficulty falling or staying asleep."],["proceed-3,somatic","Psychomotor and expression: They cry. They speak very little or not at\u003cbr\u003eall. Their facial expressions appear flat or diminished. Their\u003cbr\u003emovements and reactions are slowed."],["proceed-4,somatic","Energy: They feel that everything requires effort. They feel\u003cbr\u003ephysically weak. They have low energy. They feel fatigued or tired."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#009E73","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Somatic, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"AMC12\u002ffMsj8A+DbiLk3gvwCIOj8kKNA\u002fAHhCcUHa278AIO1RcXDevwAsQBIFeuC\u002fAFChvOqn1T8AAGQ5l6+SvwAAvTEdS6a\u002fAGCj5j0hxL8AwLRKp166PwAwGbTWxdW\u002fAIADQozouj8A0Ez4wsDLvwAAWnXRwX2\u002fABgsHJX23z8AKO7JM2HcvwAAwZiT\u002fMi\u002fAHRvgELD4L8AQPEqiq2rvwAAOop1cnQ\u002fAJAih+CW2b8AUMhfat3JPwD4dZBAdtY\u002f"},"y":{"dtype":"f8","bdata":"AJLyPhP28T8AHlKqEAP1PwBIb8Kfnt8\u002fADHC+lOU8j8AN\u002fojTjn1PwDEmzVBnfU\u002fAKgITvLp5T8AEJx7n6TmPwAS3+7bXe4\u002fAD5h3gKZ8D8AurqMPQXwPwB6SuLXaPI\u002fAP84Wn8m8j8AvHRB1Nz0PwD7cfU3IvA\u002fALLt6\u002fxD4T8Ab4x2j\u002fP0PwCInRewx\u002fA\u002fAN4dz6qq8z8AiO+dD6\u002fuPwAcKLJKruw\u002fALdbdV0y9j8ARnZt2vDpPwBeWI1MV+Y\u002f"},"z":{"dtype":"f8","bdata":"AMC9zaoBwb8AwG858\u002fTAPwBAsqIH9s0\u002fABC+bgAjyz8AgIfGH3q9PwDAtFNDrsE\u002fAECYGf3kqL8AIP+u2ojMPwDAYTNwMaQ\u002fAMAuk\u002fojqD8A4A2AF73CvwDwa6YBIsQ\u002fAMAe\u002f5TbyL8AAHfbua2svwCAm2jwv6w\u002fAECg88WysL8AAMsJRSS7PwBAl\u002fKFDrk\u002fAKAo+7dTzj8AAHVMC7TAPwBAVbpUvqk\u002fAAA5qNc1nj8AgF0Ba86QvwAAqbxthJi\u002f"},"type":"scatter3d"},{"customdata":[["dsm-5,suicidality","The person frequently thinks about death, beyond simply fearing dying.\u003cbr\u003eThey may have recurring thoughts of suicide without a specific plan,\u003cbr\u003eor they may have attempted suicide or developed a specific plan for\u003cbr\u003ecommitting suicide."],["ham-d,suicidality","The person may experience thoughts related to not wanting to live.\u003cbr\u003eThis can include feeling that life is not worth living, wishing they\u003cbr\u003ewere dead, having suicidal ideas or making suicidal gestures, or\u003cbr\u003eattempting suicide."],["icd-10,suicidality","They experience recurring thoughts about death or have engaged in\u003cbr\u003esuicidal behavior."],["madrs-1,suicidality","This person has expressed feelings that life is not worth living and\u003cbr\u003ehas indicated that a natural death would be welcome. They may feel\u003cbr\u003eweary of life, with fleeting or recurring thoughts of suicide."],["madrs-2,suicidality","At times, they may believe they would be better off dead, viewing\u003cbr\u003esuicide as a possible solution, though not necessarily with specific\u003cbr\u003eplans or intention."],["madrs-3,suicidality","They experience suicidal thoughts and may have made preparations for\u003cbr\u003esuicide. In some cases, they may have explicit plans for suicide or\u003cbr\u003emay be actively preparing for it."],["phq-9,suicidality","They have thoughts that they would be better off dead or of hurting\u003cbr\u003ethemselves in some way."],["proceed,suicidality","Autoaggression symptoms: The individual experiences thoughts related\u003cbr\u003eto their desire to continue living. They report suicidal ideation and\u003cbr\u003eengage in self-harming behaviors. They have attempted suicide."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#D55E00","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Suicidality, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"AGDmssfhtL8AEDagttfFPwAgboBOkcq\u002fAPijkwss0D8AQK4wSN2jPwAQqUTl6dC\u002fAODddNX6uL8AADuiRe+kvw=="},"y":{"dt f3TrjPwCIFu\u002fO5OQ\u002f"},"type":"scatter3d"},{"customdata":[["dsm-5,mood","This person experiences a depressed mood, feeling sad, empty, or\u003cbr\u003ehopeless, and may appear tearful to others. They have lost interest or\u003cbr\u003epleasure in activities they used to enjoy. They struggle with feelings\u003cbr\u003eof worthlessness or carry excessive or inappropriate guilt that goes\u003cbr\u003ebeyond normal self-criticism. They also have difficulty thinking\u003cbr\u003eclearly, concentrating, or making decisions."],["ham-d-1,mood","Depressed Mood: They have a gloomy attitude and feel pessimistic about\u003cbr\u003ethe future. They experience persistent feelings of sadness and may\u003cbr\u003ehave a tendency to weep."],["ham-d-2,mood","Feelings of Guilt: They engage in self-reproach and feel they have let\u003cbr\u003epeople down. They experience ideas of guilt, and may believe their\u003cbr\u003epresent illness is a punishment. In some cases, they may have\u003cbr\u003edelusions or hallucinations related to guilt."],["ham-d-3,mood","Work and Interests: They experience feelings of incapacity,\u003cbr\u003elistlessness, indecision, and vacillation. They have lost interest in\u003cbr\u003ehobbies and show decreased social activities. Their productivity has\u003cbr\u003edecreased, and they may be unable to work due to their present\u003cbr\u003eillness."],["ham-d-4,mood","Anxiety (Psychic): They experience tension and irritability. They\u003cbr\u003eworry about minor matters and have an apprehensive attitude. They may\u003cbr\u003eexperience fears."],["icd-10,mood","They experience a persistently low mood throughout the day, which\u003cbr\u003eothers may also observe. They have lost interest or pleasure in\u003cbr\u003eactivities they would normally enjoy. They struggle with feelings of\u003cbr\u003eworthlessness and carry excessive or inappropriate guilt. Their\u003cbr\u003eability to think clearly or concentrate is diminished, and they often\u003cbr\u003efeel indecisive. Their self-confidence and self-esteem are reduced."],["madrs-1,mood","Apparent Sadness: They appear despondent, gloomy, or in despair\u2014beyond\u003cbr\u003eordinary low spirits. This is reflected in their speech, facial\u003cbr\u003eexpression, and posture. They may look dispirited or unhappy, and at\u003cbr\u003etimes struggle to brighten up even when circumstances might warrant\u003cbr\u003eit."],["madrs-2,mood","Reported Sadness: They describe feeling depressed, low in spirits, or\u003cbr\u003edespondent, regardless of whether this is visible in their appearance.\u003cbr\u003eThey may report feeling beyond help or without hope. Their mood may be\u003cbr\u003einfluenced by external circumstances to varying degrees, or it may\u003cbr\u003efeel continuous and unvarying."],["madrs-3,mood","Inner Tension: They experience feelings of ill-defined discomfort,\u003cbr\u003eedginess, or inner turmoil. This mental tension can escalate to\u003cbr\u003efeelings of panic, dread, or anguish. They may seek reassurance and\u003cbr\u003efind it difficult to master these feelings on their own."],["madrs-4,mood","Concentration Difficulties: They have difficulty collecting their\u003cbr\u003ethoughts or sustaining concentration. This may interfere with their\u003cbr\u003eability to read, hold a conversation, or complete tasks that require\u003cbr\u003efocused attention."],["madrs-5,mood","Inability to Feel: They experience reduced interest in their\u003cbr\u003esurroundings or in activities that would normally bring them pleasure.\u003cbr\u003eTheir ability to react with appropriate emotion to circumstances or\u003cbr\u003epeople feels diminished. They may feel emotionally numb or\u003cbr\u003edisconnected from friends and loved ones, struggling to feel anger,\u003cbr\u003egrief, or joy."],["madrs-6,mood","Pessimistic Thoughts: They experience thoughts of guilt, inferiority,\u003cbr\u003eself-reproach, or remorse. They may engage in self-accusations or feel\u003cbr\u003eincreasingly pessimistic about the future, dwelling on ideas of\u003cbr\u003efailure, sin, or ruin."],["phq-9-1,mood","They have little interest or pleasure in doing things."],["phq-9-2,mood","They feel down, depressed, or hopeless."],["phq-9-3,mood","They feel bad about themselves, or feel like a failure, or feel they\u003cbr\u003ehave let themselves or their family down."],["phq-9-4,mood","They have trouble concentrating on things, such as reading the\u003cbr\u003enewspaper or watching television."],["proceed-1,mood","Perception of Self: This person often feels that others are against\u003cbr\u003ethem or out to get them. They experience a profound sense of\u003cbr\u003eisolation, as though they are fundamentally alone in the world. They\u003cbr\u003ecarry a belief that they are a burden to those around them and feel\u003cbr\u003ethat others do not truly understand them. They struggle with\u003cbr\u003econfidence in their own abilities and hold a diminished view of their\u003cbr\u003eown worth. At times, they feel disconnected from themselves or their\u003cbr\u003esurroundings, and they may have difficulty recognizing\u003cbr\u003ethemselves\u2014whether in the mirror or in terms of who they feel they are\u003cbr\u003eas a person."],["proceed-2,mood","Cognitive Symptoms: This person finds it difficult to feel motivated\u003cbr\u003eor to maintain interest in activities. They believe their condition is\u003cbr\u003euntreatable and hold a generally pessimistic view of situations. Their\u003cbr\u003ethinking tends to be distorted, often interpreting events in\u003cbr\u003enegatively skewed ways. They struggle to make decisions and have\u003cbr\u003edifficulty with planning, organizing, and following through on tasks.\u003cbr\u003eAdapting to new information or shifting between tasks is challenging\u003cbr\u003efor them. They find it hard to solve problems effectively and\u003cbr\u003eexperience lapses in memory. Maintaining focus and concentration is\u003cbr\u003edifficult, as is managing their time. Their perception of time may\u003cbr\u003efeel altered\u2014either dragging or slipping away. They have trouble\u003cbr\u003eenvisioning a positive future and tend to dwell on negative thoughts\u003cbr\u003erepeatedly. Their thinking often feels foggy or unclear. They may have\u003cbr\u003ereduced capacity to understand or share in others' feelings and show\u003cbr\u003ediminished interest in social connection."],["proceed-3,mood","Mood and Emotional Symptoms: This person experiences significant\u003cbr\u003epsychological pain and a pervasive sense that things will not improve.\u003cbr\u003eThey feel powerless to change their circumstances and see themselves\u003cbr\u003eas having little value. A general sense of feeling bad pervades their\u003cbr\u003eexperience, often accompanied by guilt. Sadness is a frequent\u003cbr\u003ecompanion, along with feelings of anxiety and a fear of failing at\u003cbr\u003ethings they attempt. They often feel restless and on edge, becoming\u003cbr\u003eeasily irritated and frustrated. They have difficulty managing their\u003cbr\u003eemotions and controlling their impulses. Their mood may not shift\u003cbr\u003eappropriately in response to positive events. They have lost their\u003cbr\u003esense of humor and find little or no pleasure in activities they once\u003cbr\u003eenjoyed. They often feel empty inside, and their emotional responses\u003cbr\u003ein general feel muted or dulled."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#0072B2","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Mood, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"ACAyIQ438T8ArIgrP47uPwDIjJ3JPOc\u002fAKDIzOmN6D8AyNSCWsfiPwCq5piqhPE\u002fABiLcbzo5j8AyNYnN2nqPwBA\u002fwosdeQ\u002fALQG+qxs5T8AkO7tHxfvPwDaKAWWF\u002fE\u002fAJABhhoN2D8AoIYMLnjMPwAYtpWK5eY\u002fAICfL8E+0D8AbOhjDCH0PwBow\u002fii2\u002fM\u002fAEaj1BWc9D8="},"y":{"dtype":"f8","bdata":"AHCTSOdCvr8AgIpTy0uWPwCgP5ohFKK\u002fAIBSDomu0z8AOAq\u002f2PTXPwAwMgxumrm\u002fABT0mrIT0T8AkJ3CIl6yPwCs5ZdG29Q\u002fAHxs1Kx24D8AwCzU7N+5PwDsKvVycNG\u002fAAAGFich1j8AAA7xZQ7aPwBAANIW4Zm\u002fAH7BaKuV5z8AfMoQHXHSvwDQ5PYL77G\u002fAIDZGolQyb8="},"z":{"dtype":"f8","bdata":"AAA0AlyblL8AAMxtaadsvwAYCdnyhNI\u002fACD0UyNxtr8AgP9ViUORPwDgh9S8lri\u002fAAAlHCm7qT8AQANumIG9PwCADZD+Cqw\u002fADCgjy2Ww78AwB\u002fl5VqmvwDwAbo\u002fhMI\u002fAECYPM\u002fVyD8A8DyJYRTVPwBoKgz2rtQ\u002fAAAAD+90Pr8AAIakFXSwPwBAxACp9cO\u002fAACjrXE4qr8="},"type":"scatter3d"},{"customdata":[["dsm-5,somatic","They experience noticeable changes in weight\u2014either losing or\u003cbr\u003egaining\u2014without intentionally trying to diet, along with shifts in\u003cbr\u003etheir appetite. Their sleep is disrupted, with difficulty falling or\u003cbr\u003estaying asleep, or alternatively, sleeping far more than usual. Others\u003cbr\u003ecan observe changes in their physical movements and behavior: they may\u003cbr\u003eappear restless and agitated, or conversely, slowed down in their\u003cbr\u003espeech and actions. They feel persistently tired and lack the energy\u003cbr\u003ethey once had."],["ham-d-1,somatic","Initial Insomnia: The person has difficulty falling asleep at the\u003cbr\u003ebeginning of the night."],["ham-d-10,somatic","Hypochondriasis: The person shows excessive focus on their body and\u003cbr\u003ehealth, ranging from bodily self-absorption to preoccupation with\u003cbr\u003ehealth concerns, a tendency to complain about physical ailments, or\u003cbr\u003efixed false beliefs about having a serious illness."],["ham-d-11,somatic","Weight Loss: The person has experienced a noticeable decrease in body\u003cbr\u003eweight."],["ham-d-2,somatic","Middle Insomnia: The person feels restless and disturbed during the\u003cbr\u003enight, often waking up during sleeping hours."],["ham-d-3,somatic","Delayed Insomnia: The person wakes up in the early hours of the\u003cbr\u003emorning and is unable to fall asleep again."],["ham-d-4,somatic","Retardation: The person experiences slowness in their thought\u003cbr\u003eprocesses, speech, and physical activity. They may appear apathetic\u003cbr\u003eor, in more pronounced cases, enter a state of stupor."],["ham-d-5,somatic","Agitation: The person displays restlessness that is associated with\u003cbr\u003efeelings of anxiety."],["ham-d-6,somatic","Somatic Anxiety: The person experiences physical symptoms related to\u003cbr\u003eanxiety, which may include gastrointestinal issues such as\u003cbr\u003eindigestion, cardiovascular symptoms like palpitations, headaches,\u003cbr\u003erespiratory difficulties, or genito-urinary complaints."],["ham-d-7,somatic","Gastrointestinal Somatic Symptoms: The person experiences a loss of\u003cbr\u003eappetite, a heavy feeling in the abdomen, or constipation."],["ham-d-8,somatic","General Somatic Symptoms: The person feels heaviness in their limbs,\u003cbr\u003eback, or head, and may experience diffuse backaches, a loss of energy,\u003cbr\u003eor easy fatiguability."],["ham-d-9,somatic","Genital Symptoms: The person experiences a loss of libido or, in the\u003cbr\u003ecase of women, menstrual disturbances."],["icd-10,somatic","They experience changes in their appetite\u2014either eating much less or\u003cbr\u003emuch more than usual\u2014which leads to noticeable weight loss or gain.\u003cbr\u003eTheir sleep is disrupted; they may struggle to fall or stay asleep, or\u003cbr\u003econversely find themselves sleeping far more than normal. Even minimal\u003cbr\u003eeffort leaves them feeling tired and drained, as though their energy\u003cbr\u003ehas been depleted. Their physical movements and behavior have also\u003cbr\u003echanged\u2014they may appear restless and agitated, or alternatively seem\u003cbr\u003eslowed down in their speech and actions."],["madrs-1,somatic","Reduced sleep: They experience a reduction in the duration or depth of\u003cbr\u003etheir sleep compared to their usual pattern when feeling well. This\u003cbr\u003emay manifest as difficulty falling asleep, lighter or more fitful\u003cbr\u003esleep, sleep that is broken or shortened by several hours, or sleeping\u003cbr\u003eonly a few hours per night."],["madrs-2,somatic","Reduced appetite: They experience a diminished appetite compared to\u003cbr\u003ewhen they are well. This presents as a decreased desire for food or a\u003cbr\u003eneed to force themselves to eat. Food may seem tasteless, and they may\u003cbr\u003erequire encouragement or persuasion from others to eat at all."],["madrs-3,somatic","Lassitude: They have difficulty getting started with activities and\u003cbr\u003eexperience slowness in initiating and performing everyday tasks.\u003cbr\u003eRoutine activities require considerable effort to begin and carry out,\u003cbr\u003eand in more pronounced cases, they may feel unable to do anything\u003cbr\u003ewithout assistance from others."],["phq-9-1,somatic","They have trouble falling asleep, staying asleep, or sleep too much."],["phq-9-2,somatic","They feel tired or have little energy."],["phq-9-3,somatic","They have a poor appetite or overeat."],["phq-9-4,somatic","They move or speak so slowly that other people could have noticed, or\u003cbr\u003ethe opposite\u2014they are so fidgety or restless that they have been\u003cbr\u003emoving around a lot more than usual."],["proceed-1,somatic","Physical symptoms: They experience pain or other physical symptoms.\u003cbr\u003eTheir appetite or weight has changed. They have difficulty with sexual\u003cbr\u003efunction."],["proceed-2,somatic","Sleep: They sleep excessively. Their sleep is disturbed or restless.\u003cbr\u003eThey have difficulty falling or staying asleep."],["proceed-3,somatic","Psychomotor and expression: They cry. They speak very little or not at\u003cbr\u003eall. Their facial expressions appear flat or diminished. Their\u003cbr\u003emovements and reactions are slowed."],["proceed-4,somatic","Energy: They feel that everything requires effort. They feel\u003cbr\u003ephysically weak. They have low energy. They feel fatigued or tired."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#009E73","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Somatic, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"AGCHCronuT8AeGOdIvvbvwAw8D1Tvsk\u002fAFgde\u002f0t1L8A2CORuLfZvwDolgdajd6\u002fAJDQpPoQ0z8AgGIpfzO2PwBg2yNdcMC\u002fAMC5+WNNx78AgPGnHbW+PwCIhpruLtq\u002fAIA08Shfsz8AwIcvKG\u002fMvwBgtFaYb7M\u002fADhlLPTS2j8A7C77q0rgvwAIrBb4BNG\u002fAIzFOlZp4r8AAIAYZXxOvwAALxSjkbS\u002fADilkVB50r8AsKeAizLSPwBQxQxgjtY\u002f"},"y":{"dtype":"f8","bdata":"AGhxM\u002f\u002fx8T8AINvEibXzPwD6ozwhiOI\u002fAF5+Ksl18T8ASQn138DzPwCpOSbOFPQ\u002fAE5hxaY75j8AgMjhOCHlPwAbP2Iu\u002fPA\u002fANbdfEZ28D8AvpxDnK7tPwAYnjvSXPM\u002fAJ2fTj+q8j8AWYz18H70PwDSDDOiiO4\u002fAKLq55TC4z8ArmGiuRD2PwB8jZRWAvI\u002fAP\u002f1TKFv9D8Auhnz3k3tPwDD+zZ0kPA\u002fAJKtN0bj8z8AlgUo0TznPwBsosio3+Q\u002f"},"z":{"dtype":"f8","bdata":"AOCMazmWxL8AkBO+hb7DPwAwIFUybck\u002fANDVpONozD8AUC9cirHAPwAAregddcY\u002fAACsCmKdd78A0CtXferJPwCgCgb15bE\u002fAOA\u002f0AsPsT8AQK4rFxm6vwAA5m8PgsY\u002fAPBBxnh\u002fyb8AAE29FxCdvwAAvGz7u24\u002fACCl\u002fLD+vb8AADueyqG\u002fPwAAspi6T7k\u002fAOAnpWxo0D8AYEt7H+a\u002fPwDAgYFKKqY\u002fAADXIfi8qj8AADogjQJ6vwAAaMb0eFC\u002f"},"type":"scatter3d"},{"customdata":[["dsm-5,suicidality","The person frequently thinks about death, beyond simply fearing dying.\u003cbr\u003eThey may have recurring thoughts of suicide without a specific plan,\u003cbr\u003eor they may have attempted suicide or developed a specific plan for\u003cbr\u003ecommitting suicide."],["ham-d,suicidality","The person may experience thoughts related to not wanting to live.\u003cbr\u003eThis can include feeling that life is not worth living, wishing they\u003cbr\u003ewere dead, having suicidal ideas or making suicidal gestures, or\u003cbr\u003eattempting suicide."],["icd-10,suicidality","They experience recurring thoughts about death or have engaged in\u003cbr\u003esuicidal behavior."],["madrs-1,suicidality","This person has expressed feelings that life is not worth living and\u003cbr\u003ehas indicated that a natural death would be welcome. They may feel\u003cbr\u003eweary of life, with fleeting or recurring thoughts of suicide."],["madrs-2,suicidality","At times, they may believe they would be better off dead, viewing\u003cbr\u003esuicide as a possible solution, though not necessarily with specific\u003cbr\u003eplans or intention."],["madrs-3,suicidality","They experience suicidal thoughts and may have made preparations for\u003cbr\u003esuicide. In some cases, they may have explicit plans for suicide or\u003cbr\u003emay be actively preparing for it."],["phq-9,suicidality","They have thoughts that they would be better off dead or of hurting\u003cbr\u003ethemselves in some way."],["proceed,suicidality","Autoaggression symptoms: The individual experiences thoughts related\u003cbr\u003eto their desire to continue living. They report suicidal ideation and\u003cbr\u003eengage in self-harming behaviors. They have attempted suicide."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#D55E00","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Suicidality, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"AAASKcc9q78AkCSFKLXGPwAAvlz5Is6\u002fAPAcjvZH0z8AgJizXZWVPwBYgDQyANG\u002fAGA724oZw78AQHY3V+Wzvw=="},"y":{"dtype":"f8","bdata":"AECB3ypkmj8AzKg ities they used to enjoy. They struggle with feelings\u003cbr\u003eof worthlessness or carry excessive or inappropriate guilt that goes\u003cbr\u003ebeyond normal self-criticism. They also have difficulty thinking\u003cbr\u003eclearly, concentrating, or making decisions."],["ham-d-1,mood","Depressed Mood: They have a gloomy attitude and feel pessimistic about\u003cbr\u003ethe future. They experience persistent feelings of sadness and may\u003cbr\u003ehave a tendency to weep."],["ham-d-2,mood","Feelings of Guilt: They engage in self-reproach and feel they have let\u003cbr\u003epeople down. They experience ideas of guilt, and may believe their\u003cbr\u003epresent illness is a punishment. In some cases, they may have\u003cbr\u003edelusions or hallucinations related to guilt."],["ham-d-3,mood","Work and Interests: They experience feelings of incapacity,\u003cbr\u003elistlessness, indecision, and vacillation. They have lost interest in\u003cbr\u003ehobbies and show decreased social activities. Their productivity has\u003cbr\u003edecreased, and they may be unable to work due to their present\u003cbr\u003eillness."],["ham-d-4,mood","Anxiety (Psychic): They experience tension and irritability. They\u003cbr\u003eworry about minor matters and have an apprehensive attitude. They may\u003cbr\u003eexperience fears."],["icd-10,mood","They experience a persistently low mood throughout the day, which\u003cbr\u003eothers may also observe. They have lost interest or pleasure in\u003cbr\u003eactivities they would normally enjoy. They struggle with feelings of\u003cbr\u003eworthlessness and carry excessive or inappropriate guilt. Their\u003cbr\u003eability to think clearly or concentrate is diminished, and they often\u003cbr\u003efeel indecisive. Their self-confidence and self-esteem are reduced."],["madrs-1,mood","Apparent Sadness: They appear despondent, gloomy, or in despair\u2014beyond\u003cbr\u003eordinary low spirits. This is reflected in their speech, facial\u003cbr\u003eexpression, and posture. They may look dispirited or unhappy, and at\u003cbr\u003etimes struggle to brighten up even when circumstances might warrant\u003cbr\u003eit."],["madrs-2,mood","Reported Sadness: They describe feeling depressed, low in spirits, or\u003cbr\u003edespondent, regardless of whether this is visible in their appearance.\u003cbr\u003eThey may report feeling beyond help or without hope. Their mood may be\u003cbr\u003einfluenced by external circumstances to varying degrees, or it may\u003cbr\u003efeel continuous and unvarying."],["madrs-3,mood","Inner Tension: They experience feelings of ill-defined discomfort,\u003cbr\u003eedginess, or inner turmoil. This mental tension can escalate to\u003cbr\u003efeelings of panic, dread, or anguish. They may seek reassurance and\u003cbr\u003efind it difficult to master these feelings on their own."],["madrs-4,mood","Concentration Difficulties: They have difficulty collecting their\u003cbr\u003ethoughts or sustaining concentration. This may interfere with their\u003cbr\u003eability to read, hold a conversation, or complete tasks that require\u003cbr\u003efocused attention."],["madrs-5,mood","Inability to Feel: They experience reduced interest in their\u003cbr\u003esurroundings or in activities that would normally bring them pleasure.\u003cbr\u003eTheir ability to react with appropriate emotion to circumstances or\u003cbr\u003epeople feels diminished. They may feel emotionally numb or\u003cbr\u003edisconnected from friends and loved ones, struggling to feel anger,\u003cbr\u003egrief, or joy."],["madrs-6,mood","Pessimistic Thoughts: They experience thoughts of guilt, inferiority,\u003cbr\u003eself-reproach, or remorse. They may engage in self-accusations or feel\u003cbr\u003eincreasingly pessimistic about the future, dwelling on ideas of\u003cbr\u003efailure, sin, or ruin."],["phq-9-1,mood","They have little interest or pleasure in doing things."],["phq-9-2,mood","They feel down, depressed, or hopeless."],["phq-9-3,mood","They feel bad about themselves, or feel like a failure, or feel they\u003cbr\u003ehave let themselves or their family down."],["phq-9-4,mood","They have trouble concentrating on things, such as reading the\u003cbr\u003enewspaper or watching television."],["proceed-1,mood","Perception of Self: This person often feels that others are against\u003cbr\u003ethem or out to get them. They experience a profound sense of\u003cbr\u003eisolation, as though they are fundamentally alone in the world. They\u003cbr\u003ecarry a belief that they are a burden to those around them and feel\u003cbr\u003ethat others do not truly understand them. They struggle with\u003cbr\u003econfidence in their own abilities and hold a diminished view of their\u003cbr\u003eown worth. At times, they feel disconnected from themselves or their\u003cbr\u003esurroundings, and they may have difficulty recognizing\u003cbr\u003ethemselves\u2014whether in the mirror or in terms of who they feel they are\u003cbr\u003eas a person."],["proceed-2,mood","Cognitive Symptoms: This person finds it difficult to feel motivated\u003cbr\u003eor to maintain interest in activities. They believe their condition is\u003cbr\u003euntreatable and hold a generally pessimistic view of situations. Their\u003cbr\u003ethinking tends to be distorted, often interpreting events in\u003cbr\u003enegatively skewed ways. They struggle to make decisions and have\u003cbr\u003edifficulty with planning, organizing, and following through on tasks.\u003cbr\u003eAdapting to new information or shifting between tasks is challenging\u003cbr\u003efor them. They find it hard to solve problems effectively and\u003cbr\u003eexperience lapses in memory. Maintaining focus and concentration is\u003cbr\u003edifficult, as is managing their time. Their perception of time may\u003cbr\u003efeel altered\u2014either dragging or slipping away. They have trouble\u003cbr\u003eenvisioning a positive future and tend to dwell on negative thoughts\u003cbr\u003erepeatedly. Their thinking often feels foggy or unclear. They may have\u003cbr\u003ereduced capacity to understand or share in others' feelings and show\u003cbr\u003ediminished interest in social connection."],["proceed-3,mood","Mood and Emotional Symptoms: This person experiences significant\u003cbr\u003epsychological pain and a pervasive sense that things will not improve.\u003cbr\u003eThey feel powerless to change their circumstances and see themselves\u003cbr\u003eas having little value. A general sense of feeling bad pervades their\u003cbr\u003eexperience, often accompanied by guilt. Sadness is a frequent\u003cbr\u003ecompanion, along with feelings of anxiety and a fear of failing at\u003cbr\u003ethings they attempt. They often feel restless and on edge, becoming\u003cbr\u003eeasily irritated and frustrated. They have difficulty managing their\u003cbr\u003eemotions and controlling their impulses. Their mood may not shift\u003cbr\u003eappropriately in response to positive events. They have lost their\u003cbr\u003esense of humor and find little or no pleasure in activities they once\u003cbr\u003eenjoyed. They often feel empty inside, and their emotional responses\u003cbr\u003ein general feel muted or dulled."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#0072B2","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Mood, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"pJOwikm68D9YBOuA3RXtP0zOw6ntCuc\u002fmvc\u002fDx2o5T+Ik6fXJBjkP7JjXibHR\u002fA\u002fvowuYbwG5j\u002fEZkJ9VQLmP\u002fDJOKEPe+s\u002fOrcPFRCu4z8E\u002f0HDyIvuP2D3++ce0e0\u002fsPM7HrvsyT9gH+SMdYjZP2yE8nOI2OA\u002fIE8aDi6Czz+k7J72m9X0P9herV2\u002fffU\u002fmHAX3lEs9T8="},"y":{"dtype":"f8","bdata":"gJt122KAob8wGGtvyUm6P7DAsbbgMba\u002fwCRY8pIw0D8Y1aWQdSLWP1CYfRsr\u002fLE\u002fpIpuPEaF0D8Qfj4D4Jq1P9Dgwo+Kf7M\u002fsJwo1lMT2z\u002fo6o03cnTAP8gA52qDYMq\u002fIIa1Rw8O1T8oVMT9sBzKP2AAMVuT0Kq\u002faKrlZ2UX4z8sgK3MtRbTv5jMpREmI8C\u002fKKJCMpZSwL8="},"z":{"dtype":"f8","bdata":"AHJGWp2lsT9gd2QoUqe+P3AQm\u002fYAc9Y\u002fAEAZw9AUOj8Arm\u002fjQYulPwCjgG3hw4e\u002fgDuvX+kfp7\u002fAn2w\u002fGGjGP4Aioeh15ZA\u002fADHgQulJuL8AoLz0m9S3v4A9uFriZtE\u002fUPwz71di1j\u002fQNA5+QR7cP2DR00VYINw\u002foFPzg8G\u002fuD8AmezcGP+Ov3Ae1ehLwsq\u002fEJAirlQww78="},"type":"scatter3d"},{"customdata":[["dsm-5,somatic","They experience noticeable changes in weight\u2014either losing or\u003cbr\u003egaining\u2014without intentionally trying to diet, along with shifts in\u003cbr\u003etheir appetite. Their sleep is disrupted, with difficulty falling or\u003cbr\u003estaying asleep, or alternatively, sleeping far more than usual. Others\u003cbr\u003ecan observe changes in their physical movements and behavior: they may\u003cbr\u003eappear restless and agitated, or conversely, slowed down in their\u003cbr\u003espeech and actions. They feel persistently tired and lack the energy\u003cbr\u003ethey once had."],["ham-d-1,somatic","Initial Insomnia: The person has difficulty falling asleep at the\u003cbr\u003ebeginning of the night."],["ham-d-10,somatic","Hypochondriasis: The person shows excessive focus on their body and\u003cbr\u003ehealth, ranging from bodily self-absorption to preoccupation with\u003cbr\u003ehealth concerns, a tendency to complain about physical ailments, or\u003cbr\u003efixed false beliefs about having a serious illness."],["ham-d-11,somatic","Weight Loss: The person has experienced a noticeable decrease in body\u003cbr\u003eweight."],["ham-d-2,somatic","Middle Insomnia: The person feels restless and disturbed during the\u003cbr\u003enight, often waking up during sleeping hours."],["ham-d-3,somatic","Delayed Insomnia: The person wakes up in the early hours of the\u003cbr\u003emorning and is unable to fall asleep again."],["ham-d-4,somatic","Retardation: The person experiences slowness in their thought\u003cbr\u003eprocesses, speech, and physical activity. They may appear apathetic\u003cbr\u003eor, in more pronounced cases, enter a state of stupor."],["ham-d-5,somatic","Agitation: The person displays restlessness that is associated with\u003cbr\u003efeelings of anxiety."],["ham-d-6,somatic","Somatic Anxiety: The person experiences physical symptoms related to\u003cbr\u003eanxiety, which may include gastrointestinal issues such as\u003cbr\u003eindigestion, cardiovascular symptoms like palpitations, headaches,\u003cbr\u003erespiratory difficulties, or genito-urinary complaints."],["ham-d-7,somatic","Gastrointestinal Somatic Symptoms: The person experiences a loss of\u003cbr\u003eappetite, a heavy feeling in the abdomen, or constipation."],["ham-d-8,somatic","General Somatic Symptoms: The person feels heaviness in their limbs,\u003cbr\u003eback, or head, and may experience diffuse backaches, a loss of energy,\u003cbr\u003eor easy fatiguability."],["ham-d-9,somatic","Genital Symptoms: The person experiences a loss of libido or, in the\u003cbr\u003ecase of women, menstrual disturbances."],["icd-10,somatic","They experience changes in their appetite\u2014either eating much less or\u003cbr\u003emuch more than usual\u2014which leads to noticeable weight loss or gain.\u003cbr\u003eTheir sleep is disrupted; they may struggle to fall or stay asleep, or\u003cbr\u003econversely find themselves sleeping far more than normal. Even minimal\u003cbr\u003eeffort leaves them feeling tired and drained, as though their energy\u003cbr\u003ehas been depleted. Their physical movements and behavior have also\u003cbr\u003echanged\u2014they may appear restless and agitated, or alternatively seem\u003cbr\u003eslowed down in their speech and actions."],["madrs-1,somatic","Reduced sleep: They experience a reduction in the duration or depth of\u003cbr\u003etheir sleep compared to their usual pattern when feeling well. This\u003cbr\u003emay manifest as difficulty falling asleep, lighter or more fitful\u003cbr\u003esleep, sleep that is broken or shortened by several hours, or sleeping\u003cbr\u003eonly a few hours per night."],["madrs-2,somatic","Reduced appetite: They experience a diminished appetite compared to\u003cbr\u003ewhen they are well. This presents as a decreased desire for food or a\u003cbr\u003eneed to force themselves to eat. Food may seem tasteless, and they may\u003cbr\u003erequire encouragement or persuasion from others to eat at all."],["madrs-3,somatic","Lassitude: They have difficulty getting started with activities and\u003cbr\u003eexperience slowness in initiating and performing everyday tasks.\u003cbr\u003eRoutine activities require considerable effort to begin and carry out,\u003cbr\u003eand in more pronounced cases, they may feel unable to do anything\u003cbr\u003ewithout assistance from others."],["phq-9-1,somatic","They have trouble falling asleep, staying asleep, or sleep too much."],["phq-9-2,somatic","They feel tired or have little energy."],["phq-9-3,somatic","They have a poor appetite or overeat."],["phq-9-4,somatic","They move or speak so slowly that other people could have noticed, or\u003cbr\u003ethe opposite\u2014they are so fidgety or restless that they have been\u003cbr\u003emoving around a lot more than usual."],["proceed-1,somatic","Physical symptoms: They experience pain or other physical symptoms.\u003cbr\u003eTheir appetite or weight has changed. They have difficulty with sexual\u003cbr\u003efunction."],["proceed-2,somatic","Sleep: They sleep excessively. Their sleep is disturbed or restless.\u003cbr\u003eThey have difficulty falling or staying asleep."],["proceed-3,somatic","Psychomotor and expression: They cry. They speak very little or not at\u003cbr\u003eall. Their facial expressions appear flat or diminished. Their\u003cbr\u003emovements and reactions are slowed."],["proceed-4,somatic","Energy: They feel that everything requires effort. They feel\u003cbr\u003ephysically weak. They have low uicidal gestures, or\u003cbr\u003eattempting suicide."],["icd-10,suicidality","They experience recurring thoughts about death or have engaged in\u003cbr\u003esuicidal behavior."],["madrs-1,suicidality","This person has expressed feelings that life is not worth living and\u003cbr\u003ehas indicated that a natural death would be welcome. They may feel\u003cbr\u003eweary of life, with fleeting or recurring thoughts of suicide."],["madrs-2,suicidality","At times, they may believe they would be better off dead, viewing\u003cbr\u003esuicide as a possible solution, though not necessarily with specific\u003cbr\u003eplans or intention."],["madrs-3,suicidality","They experience suicidal thoughts and may have made preparations for\u003cbr\u003esuicide. In some cases, they may have explicit plans for suicide or\u003cbr\u003emay be actively preparing for it."],["phq-9,suicidality","They have thoughts that they would be better off dead or of hurting\u003cbr\u003ethemselves in some way."],["proceed,suicidality","Autoaggression symptoms: The individual experiences thoughts related\u003cbr\u003eto their desire to continue living. They report suicidal ideation and\u003cbr\u003eengage in self-harming behaviors. They have attempted suicide."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#D55E00","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Suicidality, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"4Og8NW4Otb\u002fgAK4sJ2G7PwBP9NKNTM2\u002fwAa6EcUx0D8A6NvbZIW3vxAHzM7T7MC\u002f0NNSlIa8z78AXbRffVK6Pw=="},"y":{"dtype":"f8","bdata":"EFuDiFTvsT+QdowSKd+1v\u002fAPvCcftL8\u002fKAsvqZNeyL8gssFqYLOjvwCK\u002fErrkW0\u002fYD+YzcY1vj8oDP7cL7nCPw=="},"z":{"dtype":"f8","bdata":"aE8+ZCh48D9kYiJ1+BrxP6TK3Gg3LvQ\u002fpJAkFYJy7D88YdFHU9TvPxaf0LlW+PI\u002fEN2tlW8N7j8Ym6tNs 5T+EOxDa08PhPxikqJpHV+E\u002fqKg+4Jp31z8YKRUQEDfpP0Tm5WM\u002ffOc\u002fUML9Pryj6D9EiEzVOIflP0jLu4Mwbeo\u002f8DJC\u002fnJI8T\u002fQBXEqxcHoP8gTJPItpuE\u002fpGGg3zh65D9Ebdp3\u002fhzqP6hSRcYdfd8\u002f8HVUiuGV4D9o2NFUbhnvP0B07MJvgek\u002f0F8+wlbb5j8IyPxX0LriP6iC5pJw3uM\u002fQIcsV1Sk4z+EwU7X3VTnP+g1dXUtquo\u002feIw2XRfl4D\u002fAeknyyGXhP4TC0woLHu4\u002feJilJmmh5z+kOOCDsVHkP0zmgfjV9Oc\u002fIKaod0Kr6D80k8E3GIDnPwRD9IJgwes\u002f"},"type":"scatter3d"},{"customdata":[["dsm-5,mood","This person experiences a depressed mood, feeling sad, empty, or\u003cbr\u003ehopeless, and may appear tearful to others. They have lost interest or\u003cbr\u003epleasure in activities they used to enjoy. They struggle with feelings\u003cbr\u003eof worthlessness or carry excessive or inappropriate guilt that goes\u003cbr\u003ebeyond normal self-criticism. They also have difficulty thinking\u003cbr\u003eclearly, concentrating, or making decisions."],["ham-d-1,mood","Depressed Mood: They have a gloomy attitude and feel pessimistic about\u003cbr\u003ethe future. They experience persistent feelings of sadness and may\u003cbr\u003ehave a tendency to weep."],["ham-d-2,mood","Feelings of Guilt: They engage in self-reproach and feel they have let\u003cbr\u003epeople down. They experience ideas of guilt, and may believe their\u003cbr\u003epresent illness is a punishment. In some cases, they may have\u003cbr\u003edelusions or hallucinations related to guilt."],["ham-d-3,mood","Work and Interests: They experience feelings of incapacity,\u003cbr\u003elistlessness, indecision, and vacillation. They have lost interest in\u003cbr\u003ehobbies and show decreased social activities. Their productivity has\u003cbr\u003edecreased, and they may be unable to work due to their present\u003cbr\u003eillness."],["ham-d-4,mood","Anxiety (Psychic): They experience tension and irritability. They\u003cbr\u003eworry about minor matters and have an apprehensive attitude. They may\u003cbr\u003eexperience fears."],["icd-10,mood","They experience a persistently low mood throughout the day, which\u003cbr\u003eothers may also observe. They have lost interest or pleasure in\u003cbr\u003eactivities they would normally enjoy. They struggle with feelings of\u003cbr\u003eworthlessness and carry excessive or inappropriate guilt. Their\u003cbr\u003eability to think clearly or concentrate is diminished, and they often\u003cbr\u003efeel indecisive. Their self-confidence and self-esteem are reduced."],["madrs-1,mood","Apparent Sadness: They appear despondent, gloomy, or in despair\u2014beyond\u003cbr\u003eordinary low spirits. This is reflected in their speech, facial\u003cbr\u003eexpression, and posture. They may look dispirited or unhappy, and at\u003cbr\u003etimes struggle to brighten up even when circumstances might warrant\u003cbr\u003eit."],["madrs-2,mood","Reported Sadness: They describe feeling depressed, low in spirits, or\u003cbr\u003edespondent, regardless of whether this is visible in their appearance.\u003cbr\u003eThey may report feeling beyond help or without hope. Their mood may be\u003cbr\u003einfluenced by external circumstances to varying degrees, or it may\u003cbr\u003efeel continuous and unvarying."],["madrs-3,mood","Inner Tension: They experience feelings of ill-defined discomfort,\u003cbr\u003eedginess, or inner turmoil. This mental tension can escalate to\u003cbr\u003efeelings of panic, dread, or anguish. They may seek reassurance and\u003cbr\u003efind it difficult to master these feelings on their own."],["madrs-4,mood","Concentration Difficulties: They have difficulty collecting their\u003cbr\u003ethoughts or sustaining concentration. This may interfere with their\u003cbr\u003eability to read, hold a conversation, or complete tasks that require\u003cbr\u003efocused attention."],["madrs-5,mood","Inability to Feel: They experience reduced interest in their\u003cbr\u003esurroundings or in activities that would normally bring them pleasure.\u003cbr\u003eTheir ability to react with appropriate emotion to circumstances or\u003cbr\u003epeople feels diminished. They may feel emotionally numb or\u003cbr\u003edisconnected from friends and loved ones, struggling to feel anger,\u003cbr\u003egrief, or joy."],["madrs-6,mood","Pessimistic Thoughts: They experience thoughts of guilt, inferiority,\u003cbr\u003eself-reproach, or remorse. They may engage in self-accusations or feel\u003cbr\u003eincreasingly pessimistic about the future, dwelling on ideas of\u003cbr\u003efailure, sin, or ruin."],["phq-9-1,mood","They have little interest or pleasure in doing things."],["phq-9-2,mood","They feel down, depressed, or hopeless."],["phq-9-3,mood","They feel bad about themselves, or feel like a failure, or feel they\u003cbr\u003ehave let themselves or their family down."],["phq-9-4,mood","They have trouble concentrating on things, such as reading the\u003cbr\u003enewspaper or watching television."],["proceed-1,mood","Perception of Self: This person often feels that others are against\u003cbr\u003ethem or out to get them. They experience a profound sense of\u003cbr\u003eisolation, as though they are fundamentally alone in the world. They\u003cbr\u003ecarry a belief that they are a burden to those around them and feel\u003cbr\u003ethat others do not truly understand them. They struggle with\u003cbr\u003econfidence in their own abilities and hold a diminished view of their\u003cbr\u003eown worth. At times, they feel disconnected from themselves or their\u003cbr\u003esurroundings, and they may have difficulty recognizing\u003cbr\u003ethemselves\u2014whether in the mirror or in terms of who they feel they are\u003cbr\u003eas a person."],["proceed-2,mood","Cognitive Symptoms: This person finds it difficult to feel motivated\u003cbr\u003eor to maintain interest in activities. They believe their condition is\u003cbr\u003euntreatable and hold a generally pessimistic view of situations. Their\u003cbr\u003ethinking tends to be distorted, often interpreting events in\u003cbr\u003enegatively skewed ways. They struggle to make decisions and have\u003cbr\u003edifficulty with planning, organizing, and following through on tasks.\u003cbr\u003eAdapting to new information or shifting between tasks is challenging\u003cbr\u003efor them. They find it hard to solve problems effectively and\u003cbr\u003eexperience lapses in memory. Maintaining focus and concentration is\u003cbr\u003edifficult, as is managing their time. Their perception of time may\u003cbr\u003efeel altered\u2014either dragging or slipping away. They have trouble\u003cbr\u003eenvisioning a positive future and tend to dwell on negative thoughts\u003cbr\u003erepeatedly. Their thinking often feels foggy or unclear. They may have\u003cbr\u003ereduced capacity to understand or share in others' feelings and show\u003cbr\u003ediminished interest in social connection."],["proceed-3,mood","Mood and Emotional Symptoms: This person experiences significant\u003cbr\u003epsychological pain and a pervasive sense that things will not improve.\u003cbr\u003eThey feel powerless to change their circumstances and see themselves\u003cbr\u003eas having little value. A general sense of feeling bad pervades their\u003cbr\u003eexperience, often accompanied by guilt. Sadness is a frequent\u003cbr\u003ecompanion, along with feelings of anxiety and a fear of failing at\u003cbr\u003ethings they attempt. They often feel restless and on edge, becoming\u003cbr\u003eeasily irritated and frustrated. They have difficulty managing their\u003cbr\u003eemotions and controlling their impulses. Their mood may not shift\u003cbr\u003eappropriately in response to positive events. They have lost their\u003cbr\u003esense of humor and find little or no pleasure in activities they once\u003cbr\u003eenjoyed. They often feel empty inside, and their emotional responses\u003cbr\u003ein general feel muted or dulled."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#0072B2","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Mood, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"XNfk\u002fxit8D+42yMxEnrtPySbaJV47Oc\u002fJEn5qZCg5j+kaR3W8oXkP8QfwXGz1PA\u002fzKkk9soM5j+UPY1HQIPmP8z6YUaif+o\u002fJM7lfYSy4z9MSMX1avXvP1D7E5gkp+0\u002fIGQBRylzzT+YQlMe7JPaP3SxeWt9zOI\u002fmEjmtbyj0D9AoTnY2GP0P1wuQVHfB\u002fU\u002fUIJQ\u002fngA9T8="},"y":{"dtype":"f8","bdata":"QAHQNx\u002fuqL+AUwVX90a3P8DY5aixhLq\u002fuIYHZbUmzz9wVNZEqYLWP+BLzKw3uas\u002fELcttFlQ0j8Qh08Do9m5PyBX4rmWtbY\u002f2NNA1pmc2z8A3FhHkza+P0C+Rvpmw8u\u002foE70sKuh1j+w59O3OrnNPwAFkWid5au\u002frqDhNJpW5D9k8YP\u002fhafSvwA8w\u002fn0bby\u002fEPoC\u002fUX8wr8="},"z":{"dtype":"f8","bdata":"gDiOKewdsz9AynieZqm+P8AXyIDS29U\u002fAEAB\u002flHULz\u002fAngm4sn+iP8DuRfRpOKS\u002fAIfDfNTxq7\u002fwRYJJctvCPwDdz3pmXZ4\u002fYKFk5KMAu7+AZvOXhrO7vzCMT2LA\u002fdE\u002fMNwwoD130z9gCj\u002fJj+bbP3BnA8BrXtg\u002fgMrga9Lcqz8AREjJ53hgP8DamBEXm8m\u002fwKrwUqY2wL8="},"type":"scatter3d"},{"customdata":[["dsm-5,somatic","They experience noticeable changes in weight\u2014either losing or\u003cbr\u003egaining\u2014without intentionally trying to diet, along with shifts in\u003cbr\u003etheir appetite. Their sleep is disrupted, with difficulty falling or\u003cbr\u003estaying asleep, or alternatively, sleeping far more than usual. Others\u003cbr\u003ecan observe changes in their physical movements and behavior: they may\u003cbr\u003eappear restless and agitated, or conversely, slowed down in their\u003cbr\u003espeech and actions. They feel persistently tired and lack the energy\u003cbr\u003ethey once had."],["ham-d-1,somatic","Initial Insomnia: The person has difficulty falling asleep at the\u003cbr\u003ebeginning of the night."],["ham-d-10,somatic","Hypochondriasis: The person shows excessive focus on their body and\u003cbr\u003ehealth, ranging from bodily self-absorption to preoccupation with\u003cbr\u003ehealth concerns, a tendency to complain about physical ailments, or\u003cbr\u003efixed false beliefs about having a serious illness."],["ham-d-11,somatic","Weight Loss: The person has experienced a noticeable decrease in body\u003cbr\u003eweight."],["ham-d-2,somatic","Middle Insomnia: The person feels restless and disturbed during the\u003cbr\u003enight, often waking up during sleeping hours."],["ham-d-3,somatic","Delayed Insomnia: The person wakes up in the early hours of the\u003cbr\u003emorning and is unable to fall asleep again."],["ham-d-4,somatic","Retardation: The person experiences slowness in their thought\u003cbr\u003eprocesses, speech, and physical activity. They may appear apathetic\u003cbr\u003eor, in more pronounced cases, enter a state of stupor."],["ham-d-5,somatic","Agitation: The person displays restlessness that is associated with\u003cbr\u003efeelings of anxiety."],["ham-d-6,somatic","Somatic Anxiety: The person experiences physical symptoms related to\u003cbr\u003eanxiety, which may include gastrointestinal issues such as\u003cbr\u003eindigestion, cardiovascular symptoms like palpitations, headaches,\u003cbr\u003erespiratory difficulties, or genito-urinary complaints."],["ham-d-7,somatic","Gastrointestinal Somatic Symptoms: The person experiences a loss of\u003cbr\u003eappetite, a heavy feeling in the abdomen, or constipation."],["ham-d-8,somatic","General Somatic Symptoms: The person feels heaviness in their limbs,\u003cbr\u003eback, or head, and may experience diffuse backaches, a loss of energy,\u003cbr\u003eor easy fatiguability."],["ham-d-9,somatic","Genital Symptoms: The person experiences a loss of libido or, in the\u003cbr\u003ecase of women, menstrual disturbances."],["icd-10,somatic","They experience changes in their appetite\u2014either eating much less or\u003cbr\u003emuch more than usual\u2014which leads to noticeable weight loss or gain.\u003cbr\u003eTheir sleep is disrupted; they may struggle to fall or stay asleep, or\u003cbr\u003econversely find themselves sleeping far more than normal. Even minimal\u003cbr\u003eeffort leaves them feeling tired and drained, as though their energy\u003cbr\u003ehas been depleted. Their physical movements and behavior have also\u003cbr\u003echanged\u2014they may appear restless and agitated, or alternatively seem\u003cbr\u003eslowed down in their speech and actions."],["madrs-1,somatic","Reduced sleep: They experience a reduction in the duration or depth of\u003cbr\u003etheir sleep compared to their usual pattern when feeling well. This\u003cbr\u003emay manifest as difficulty falling asleep, lighter or more fitful\u003cbr\u003esleep, sleep that is broken or shortened by several hours, or sleeping\u003cbr\u003eonly a few hours per night."],["madrs-2,somatic","Reduced appetite: They experience a diminished appetite compared to\u003cbr\u003ewhen they are well. This presents as a decreased desire for food or a\u003cbr\u003eneed to force themselves to eat. Food may seem tasteless, and they may\u003cbr\u003erequire encouragement or persuasion from others to eat at all."],["madrs-3,somatic","Lassitude: They have difficulty getting started with activities and\u003cbr\u003eexperience slowness in initiating and performing everyday tasks.\u003cbr\u003eRoutine activities require considerable effort to begin and carry out,\u003cbr\u003eand in more pronounced cases, they may feel unable to do anything\u003cbr\u003ewithout assistance from others."],["phq-9-1,somatic","They have trouble falling asleep, staying asleep, or sleep too much."],["phq-9-2,somatic","They feel tired or have little energy."],["phq-9-3,somatic","They have a poor appetite or overeat."],["phq-9-4,somatic","They move or speak so slowly that other people could have noticed, or\u003cbr\u003ethe opposite\u2014they are so fidgety or restless that they have been\u003cbr\u003emoving around a lot more than usual."],["proceed-1,somatic","Physical symptoms: They experience pain or other physical symptoms.\u003cbr\u003eTheir appetite or weight has changed. They have difficulty with sexual\u003cbr\u003efunction."],["proceed-2,somatic","Sleep: They sleep excessively. Their sleep is disturbed or restless.\u003cbr\u003eThey have difficulty falling or staying asleep."],["proceed-3,somatic","Psychomotor and expression: They cry. They speak very little or not at\u003cbr\u003eall. Their facial expressions appear flat or diminished. Their\u003cbr\u003emovements and reactions are slowed."],["proceed-4,somatic","Energy: They feel that everything requires effort. They feel\u003cbr\u003ephysically weak. They have low energy. They feel fatigued or tired."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u00b7 somatic %{y:.2f} \u00b7 suicidality %{z:.2f}\u003cbr\u003e%{customdata[1]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":"#009E73","line":{"width":0},"opacity":0.85,"size":4,"symbol":"square"},"mode":"markers","name":"Somatic, Core Clinical \u00b7 In-Sample","visible":false,"x":{"dtype":"f8","bdata":"AMglgPPPvT\u002fwryYtu6HgvxhE9s68GNQ\u002fFDWVhiNF4L\u002fQFev\u002fx1fbvxQYRE2jpOG\u002fkLJ25in2wj8AOYI5cZ6Xv0ACmMtcx6O\u002fYG6hefme0L9AILgHDTyrPyCRJ1PTR8u\u002fYP8vUo4xxD\u002fgU1ArKL7Lv8Cl6FZ3O7k\u002fbO7vO3Gg2j88pnz9CGHgvzBvzpUCiMu\u002f+CWxI+m43L\u002fQSWlDgEHAv+BN3PZlNrS\u002f4PR\u002fxMkg079Ys6FJUkbGP2DF1Zx5wNU\u002f"},"y":{"dtype":"f8","bdata":"KH++SlKT8D9jLwoCTJj1P9J6ayJjFeA\u002fPx9s4Os19D+U\u002f9EKP4X1P+U2\u002fdxLVPY\u002fiPnNo1b17D9YIEBLqgXsP6Ta9In9Ve8\u002f47MmQ6gr8z\u002f8h8huJtruP2+qvFqR8PA\u002fva+B\u002fLRA8T+\u002fbePTdjP1P+wX\u002fn0FLu4\u002fgrYiwpvs4j\u002f4HkUYYPv1P0hH\u002f+ecsPE\u002f8AFNyNaR8T8ZJR70cM\u002fpPxOZeX21avE\u002f5wELcg0a9j963DCMZfHqP1mkfxDYFuM\u002f"},"z":{"dtype":"f8","bdata":"QCT\u002fzOWIvr8w3\u002fVr93LEPyCKAXCND8U\u002fEA4y1Xxzzz9gEGIhA2y2P4CvIa3RJr0\u002fgLhbuVGqqr9wu6Vfj9LAP4AFwmfCcbY\u002fIEl1Gbs0sD\u002fAW7CrFn+lv+AyoG12c8Q\u002fUCFfnTNxx78g55VrfbizvwBjAdHQwKE\u002fQGCGTqHDt7+waChj2tvEP8Cy5pVCzM4\u002f2Isk66yY1D\u002fgF57kDcO2P8ClR4FPR68\u002fgAkU2CJTmb\u002fgW1JF+6uyvwDUJSwc\u002fX8\u002f"},"type":"scatter3d"},{"customdata":[["dsm-5,suicidality","The person frequently thinks about death, beyond simply fearing dying.\u003cbr\u003eThey may have recurring thoughts of suicide without a specific plan,\u003cbr\u003eor they may have attempted suicide or developed a specific plan for\u003cbr\u003ecommitting suicide."],["ham-d,suicidality","The person may experience thoughts related to not wanting to live.\u003cbr\u003eThis can include feeling that life is not worth living, wishing they\u003cbr\u003ewere dead, having suicidal ideas or making suicidal gestures, or\u003cbr\u003eattempting suicide."],["icd-10,suicidality","They experience recurring thoughts about death or have engaged in\u003cbr\u003esuicidal behavior."],["madrs-1,suicidality","This person has expressed feelings that life is not worth living and\u003cbr\u003ehas indicated that a natural death would be welcome. They may feel\u003cbr\u003eweary of life, with fleeting or recurring thoughts of suicide."],["madrs-2,suicidality","At times, they may believe they would be better off dead, viewing\u003cbr\u003esuicide as a possible solution, though not necessarily with specific\u003cbr\u003eplans or intention."],["madrs-3,suicidality","They experience suicidal thoughts and may have made preparations for\u003cbr\u003esuicide. In some cases, they may have explicit plans for suicide or\u003cbr\u003emay be actively preparing for it."],["phq-9,suicidality","They have thoughts that they would be better off dead or of hurting\u003cbr\u003ethemselves in some way."],["proceed,suicidality","Autoaggression symptoms: The individual experiences thoughts related\u003cbr\u003eto their desire to continue living. They report suicidal ideation and\u003cbr\u003eengage in self-harming behaviors. They have attempted suicide."]],"hovertemplate":"%{customdata[0]}\u003cbr\u003e\u03b2 mood %{x:.2f} \u
