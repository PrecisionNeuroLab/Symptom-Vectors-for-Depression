name: Deploy TMLR paper to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'tmlr-beyond-pdf-author-kit/**'
      - 'make_review_page.py'
      - '.github/actions/build-site/**'
      - '.github/workflows/tmlr-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: tmlr-beyond-pdf-author-kit

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The online-editor import (compile_submission.py, submission_folder/, tmlr_do_not_modify/).
      # Built first, while tmlr_do_not_modify/ is still pristine: the site build adds _under_review/,
      # merged assets, vendor/ and _site/ there.
      - name: Zip editor import
        working-directory: .
        run: python -I make_tmlr_zip.py

      - uses: actions/upload-artifact@v4
        with:
          name: tmlr-editor-import-${{ github.sha }}
          path: tmlr-submission.zip
          retention-days: 90

      # Backstop for clones without the pre-commit hook: never deploy figures with non-public text.
      - name: Check figure text is public
        working-directory: .
        run: python -I check_figure_text.py --all

      # Anonymous paper, review page, and preprint: see the action for why it builds all three.
      - uses: ./.github/actions/build-site

      # The OpenReview upload: built from this exact commit, only after the site built cleanly.
      - name: Zip submission folder
        run: zip -r submission_folder.zip submission_folder -x '*.DS_Store' '*/.ipynb_checkpoints/*'

      - uses: actions/upload-artifact@v4
        with:
          name: submission_folder-${{ github.sha }}
          path: tmlr-beyond-pdf-author-kit/submission_folder.zip
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}under_review/submission/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
